name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: soap
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: composer audit

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        db: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shopbonus_testing
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, bcmath, intl, soap
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Run tests
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'shopbonus_testing' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          mkdir -p build/qa
          date -u +'%Y-%m-%dT%H:%M:%SZ' > build/qa/executed-at.txt
          git rev-parse HEAD > build/qa/tested-sha.txt
          php artisan test --log-junit=build/qa/source.junit.xml
      - name: Record isolated CI Quality Center evidence
        if: ${{ always() && !cancelled() && hashFiles('build/qa/source.junit.xml') != '' }}
        env:
          APP_ENV: testing
          APP_RELEASE_SHA: ${{ github.sha }}
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/build/qa/qa.sqlite
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force
          php artisan shopbonus:qa-discover --sha="$(cat build/qa/tested-sha.txt)"
          php artisan route:list --json > build/qa/routes.json
          php artisan shopbonus:qa-import build/qa/source.junit.xml --suite=full --environment=ci --sha="$(cat build/qa/tested-sha.txt)" --executed-at="$(cat build/qa/executed-at.txt)" --mocked --output=build/qa/results.json
      - name: Retain sanitized QA evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-${{ matrix.php }}-${{ matrix.db }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/qa/results.json
            build/qa/results.junit.xml
            build/qa/routes.json
            build/qa/executed-at.txt
            build/qa/tested-sha.txt
