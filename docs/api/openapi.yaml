  /api/v1/public/faq:
    get:
      tags: [Content]
      operationId: publicFaq
      summary: "FAQ"
      description: |
        Published items by category in order. Audience is enforced here: anonymous visitors get `public` items; verified users also `consumers`; workspace members also `merchants` (responses then `private, no-store`). Search covers questions and answers. Missing translations fall back to NL (`fallback: true`).
      x-access: public
      security: []
      parameters:
        - { name: locale, in: query, required: false, schema: { type: string, enum: [nl, en], default: nl } }
        - { name: search, in: query, required: false, schema: { type: string } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/public/faq?locale=nl&search=code' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "FAQ (captured: signed-in consumer searching)."
          content:
            application/json:
              example: {"data":[{"key":"vouchers","name":"Vouchers","items":[{"id":"01m5pyvhqshtvd68zgcw6cz71k","question":"Waar vind ik mijn code?","answer":{"type":"doc","content":[{"type":"heading","attrs":{"level":2},"content":[{"text":"Code","type":"text"}]},{"type":"paragraph","content":[{"text":"In Mijn vouchers.","type":"text"},{"text":"Lees meer","type":"text","marks":[{"type":"link","attrs":{"href":"\/hulp"}}]}]}]},"audience":"consumers","fallback":false}]}]}

