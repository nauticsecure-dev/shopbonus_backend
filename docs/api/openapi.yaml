              example: {"data":{"key":"voorwaarden","type":"terms","locale":"nl","slug":"algemene-voorwaarden","content":{"body":{"type":"doc","content":[{"type":"heading","attrs":{"level":2},"content":[{"text":"Artikel 1","type":"text"}]},{"type":"paragraph","content":[{"text":"Definities.","type":"text"},{"text":"Lees meer","type":"text","marks":[{"type":"link","attrs":{"href":"\/hulp"}}]}]}]},"title":"Algemene voorwaarden"},"legal":{"version":"2026.11","effective_date":"2026-11-01"},"revision":1,"published_at":"2026-10-24T12:40:59+00:00","alternates":{"nl":"algemene-voorwaarden"}}}
        '404':
