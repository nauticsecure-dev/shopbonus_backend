  /api/v1/admin/cms/cookie-policies:
    get:
      tags: [CMS]
      operationId: cookiePolicies
      summary: "Cookie policy versions"
      description: |
        All versions with status draft/published/retired.
      x-access: admin
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/admin/cms/cookie-policies' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>'
      responses:
        '200':
          description: "Versions."
          content:
            application/json:
              example: {"data":[{"id":"01m5pzxpagmfpbh19v6pmxbq4p","version":"2026.2","status":"published","requires_reconsent":true,"published_at":"2026-10-24T12:59:40+00:00"},{"id":"01m5pzxnv6j8jd16cxmvwpnh96","version":"2026.1","status":"retired","requires_reconsent":false,"published_at":"2026-10-24T12:59:40+00:00"}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
    post:
      tags: [CMS]
      operationId: createCookiePolicy
      summary: "Create a cookie policy draft"
      description: |
        Step-up required. Categories and an allowlist of trackers per category (no pasted code), NL/EN banner texts (plain text). Requires human compliance review before publishing. Audited.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, categories, texts]
              properties:
                version: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
                requires_reconsent: { type: boolean, description: 'Visitors who chose under an earlier version must choose again.' }
                categories:
                  type: array
                  minItems: 4
                  maxItems: 4
                  description: 'Exactly necessary, preferences, analytics, marketing; necessary is always required.'
                  items: { type: object, properties: { key: { type: string, enum: [necessary, preferences, analytics, marketing] }, trackers: { type: array, items: { type: object, properties: { key: { type: string }, name: { type: string }, provider: { type: string }, purpose_nl: { type: string }, purpose_en: { type: string }, retention: { type: string } } } } } }
                texts: { type: object, description: '{nl|en: {title, body, accept_all, reject_optional, customize}} (plain text)' }
            example: {"version": "2026.1", "requires_reconsent": false, "texts": {"nl": {"title": "Cookies op ShopBonus", "body": "Wij gebruiken noodzakelijke cookies en, met jouw toestemming, statistiek- en marketingcookies.", "accept_all": "Alles accepteren", "reject_optional": "Optionele weigeren", "customize": "Aanpassen"}, "en": {"title": "Cookies on ShopBonus", "body": "We use necessary cookies and, with your consent, analytics and marketing cookies.", "accept_all": "Accept all", "reject_optional": "Reject optional", "customize": "Customize"}}, "categories": [{"key": "necessary", "trackers": [{"key": "session", "name": "Sessie", "provider": "ShopBonus", "purpose_nl": "Ingelogd blijven", "purpose_en": "Staying signed in", "retention": "Sessie"}]}, {"key": "preferences", "trackers": []}, {"key": "analytics", "trackers": [{"key": "plausible", "name": "Plausible Analytics", "provider": "Plausible", "purpose_nl": "Anonieme bezoekstatistieken", "purpose_en": "Anonymous visit statistics", "retention": "24 uur"}]}, {"key": "marketing", "trackers": [{"key": "meta_pixel", "name": "Meta Pixel", "provider": "Meta", "purpose_nl": "Advertenties meten", "purpose_en": "Measuring ads", "retention": "90 dagen"}]}]}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/admin/cms/cookie-policies' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"version":"2026.1",...}'
      responses:
        '201':
          description: "Draft."
          content:
            application/json:
              example: {"data":{"id":"01m5pzxnv6j8jd16cxmvwpnh96","status":"draft","version":"2026.1","requires_reconsent":false,"published_at":null,"texts":{"title":"Cookies op ShopBonus","body":"Wij gebruiken noodzakelijke cookies en, met jouw toestemming, statistiek- en marketingcookies.","accept_all":"Alles accepteren","reject_optional":"Optionele weigeren","customize":"Aanpassen"},"categories":[{"key":"necessary","required":true,"trackers":[{"key":"session","name":"Sessie","provider":"ShopBonus","purpose":"Ingelogd blijven","retention":"Sessie"}]},{"key":"preferences","required":false,"trackers":[]},{"key":"analytics","required":false,"trackers":[{"key":"plausible","name":"Plausible Analytics","provider":"Plausible","purpose":"Anonieme bezoekstatistieken","retention":"24 uur"}]},{"key":"marketing","required":false,"trackers":[{"key":"meta_pixel","name":"Meta Pixel","provider":"Meta","purpose":"Advertenties meten","retention":"90 dagen"}]}]}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/PasswordConfirmationRequired' }

