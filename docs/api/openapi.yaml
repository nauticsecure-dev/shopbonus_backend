  /api/v1/integrations/answer24/contact-results:
    post:
      tags: [Answer24 integration]
      operationId: answer24ContactResult
      summary: "Report a contact result (Answer24)"
      description: |
        Scope `answer24.contact_results`. Status callback for a dispatched contact request: `accepted`, `rejected`, `attempted`, `completed`, `failed`, `cancelled`.
                Transitions: dispatched → any; accepted → attempted/completed/failed/cancelled; attempted → attempted/completed/failed/cancelled; cancellation_requested → cancelled. Anything else is 409 `invalid_transition`.
                A result older than the last applied one is recorded but not applied (`outcome: stale`); the same event ID again returns `outcome: duplicate`. The Order Sheet `contact_status` follows applied results.
                `webshop_id` must be the opportunity's webshop, otherwise 404 (no cross-tenant addressing). `remote_reference` must match the one returned at dispatch (409 `remote_reference_mismatch`).
      x-access: integration
      security: [{ integrationSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webshop_id, opportunity_id, status, occurred_at]
              properties:
                webshop_id: { type: string }
                opportunity_id: { type: string }
                status: { type: string, enum: [accepted, rejected, cancelled, attempted, completed, failed] }
                occurred_at: { type: string, format: date-time }
                remote_reference: { type: string, maxLength: 120 }
                reason: { type: string, maxLength: 255 }
            example: {"webshop_id": "01m5n4cw5mqeyx3e20rjqam8an", "opportunity_id": "01m5n4czt76jrgb97rxme4fxjp", "status": "accepted", "occurred_at": "2026-10-23T19:39:29Z", "remote_reference": "A24-778812"}
      x-codeSamples:
        - lang: curl
          source: |
            BODY='{"webshop_id":"…","opportunity_id":"…","status":"accepted","occurred_at":"2026-10-23T19:39:29Z","remote_reference":"A24-778812"}'; T=$(date +%s)
            SIG=$(printf '%s' "$T.$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')
            curl -i -X POST 'http://localhost:8000/api/v1/integrations/answer24/contact-results' \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H "X-Shopbonus-Key: $KEY_ID" -H "X-Shopbonus-Signature: t=$T,v1=$SIG" -H 'X-Shopbonus-Event-Id: <unique id>' \
              --data-binary "$BODY"
      responses:
        '200':
          description: "Applied (or `duplicate` / `stale`, see description)."
          content:
            application/json:
              example: {"data":{"opportunity_id":"01m5n4g9mbtc52yzynyrp1p239","status":"accepted","outcome":"applied"}}
        '400':
          description: "X-Shopbonus-Event-Id missing (`event_id_required`)."
          content:
            application/json:
              example: {"error":{"status":400,"code":"event_id_required","message":"X-Shopbonus-Event-Id is required (max 120 characters).","request_id":"01a16a48-304a-72ed-b93d-cecc7186aeb4"}}
        '401':
          description: "Unknown/revoked key, bad or expired signature (5-minute window). Audited."
          content:
            application/json:
              example: {"error":{"status":401,"code":"integration_signature_invalid","message":"The request signature is missing or invalid.","request_id":"01a16a48-3081-7027-9b84-5d1adad35e88"}}
        '403':
          description: "The key lacks the scope for this endpoint."
          content:
            application/json:
              example: {"error":{"status":403,"code":"integration_scope_denied","message":"This integration key may not call this endpoint.","request_id":"01a16a48-30bb-732e-95a0-2f643062223a","details":{"required_scope":"answer24.contact_results"}}}
        '404':
          description: "Unknown opportunity, or not of that webshop."
          content:
            application/json:
              example: {"error":{"status":404,"code":"opportunity_not_found","message":"Contact request not found.","request_id":"01a16a48-300e-71aa-bead-9a6d276e41a9"}}
        '409':
          description: "`invalid_transition`, `remote_reference_mismatch` or `event_id_reused`."
          content:
            application/json:
              example: {"error":{"status":409,"code":"invalid_transition","message":"This result cannot be applied in the current state.","request_id":"01a16a48-2fcd-70cc-a3e3-e8331a232bc5","details":{"status":"accepted","result":"rejected"}}}
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/integrations/answer24/handoffs:
    post:
      tags: [Answer24 integration]
      operationId: answer24Handoff
      summary: "Hand off the free voucher: reserve a code, get the claim link (Answer24)"
      description: |
        Scope `answer24.handoffs`. Only after permitted engagement (opportunity `accepted`, `attempted` or `completed`; else 409 `handoff_not_permitted`).
                Reserves one code of the opportunity's offer in the single inventory (409 `offer_out_of_stock` when none is left; nothing else is created then) and returns a short (24-character), unguessable, single-use claim URL for Answer24 to deliver.
                Idempotent per opportunity: a repeated handoff returns 200 with the same claim and URL; never a second code. The claim expires with the offer's claim window (90 days by default); the unclaimed code then returns to the inventory.
      x-access: integration
      security: [{ integrationSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webshop_id, opportunity_id]
              properties:
                webshop_id: { type: string, description: Webshop public ID from the contact request. }
                opportunity_id: { type: string, description: Opportunity public ID from the contact request. }
            example: {"webshop_id": "01m5n4cw5mqeyx3e20rjqam8an", "opportunity_id": "01m5n4czt76jrgb97rxme4fxjp"}
      x-codeSamples:
        - lang: curl
          source: |
            BODY='{"webshop_id":"…","opportunity_id":"…"}'; T=$(date +%s)
            SIG=$(printf '%s' "$T.$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')
            curl -i -X POST 'http://localhost:8000/api/v1/integrations/answer24/handoffs' \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H "X-Shopbonus-Key: $KEY_ID" -H "X-Shopbonus-Signature: t=$T,v1=$SIG" -H 'X-Shopbonus-Event-Id: <unique id>' \
              --data-binary "$BODY"
      responses:
        '201':
          description: "Code reserved, claim link created."
          content:
            application/json:
              example: {"data":{"claim_id":"01m5n4gc8vk6t23v5n3xqh5tsm","status":"open","expires_at":"2027-01-21T19:41:18+00:00","claimed_at":null,"reminder_days":[30,60,80],"claim_url":"http:\/\/localhost:3000\/claim\/<claim-token>"}}
        '200':
          description: "Repeated handoff: same claim and URL."
          content:
            application/json:
              example: {"data":{"claim_id":"01m5n4gc8vk6t23v5n3xqh5tsm","status":"open","expires_at":"2027-01-21T19:41:18+00:00","claimed_at":null,"reminder_days":[30,60,80],"claim_url":"http:\/\/localhost:3000\/claim\/<claim-token>"}}
        '401':
          description: "Unknown/revoked key, bad or expired signature (5-minute window). Audited."
          content:
            application/json:
              example: {"error":{"status":401,"code":"integration_signature_invalid","message":"The request signature is missing or invalid.","request_id":"01a16a48-3081-7027-9b84-5d1adad35e88"}}
        '403':
          description: "The key lacks the scope for this endpoint."
          content:
            application/json:
              example: {"error":{"status":403,"code":"integration_scope_denied","message":"This integration key may not call this endpoint.","request_id":"01a16a48-30bb-732e-95a0-2f643062223a","details":{"required_scope":"answer24.contact_results"}}}
        '404':
          description: "Unknown opportunity, or not of that webshop."
          content:
            application/json:
              example: {"error":{"status":404,"code":"opportunity_not_found","message":"Contact request not found.","request_id":"01a16a48-300e-71aa-bead-9a6d276e41a9"}}
        '409':
          description: "`handoff_not_permitted`, `handoff_no_offer`, `offer_out_of_stock`, `offer_not_active`."
          content:
            application/json:
              example: {"error":{"status":409,"code":"handoff_not_permitted","message":"A voucher can only be handed off after the customer accepted the contact.","request_id":"01a16a48-2e3f-71db-b5c8-7086972b7757","details":{"status":"dispatched"}}}
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/integrations/answer24/claims/{claim}:
    parameters:
