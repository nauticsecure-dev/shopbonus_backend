  /api/v1/admin/cms/pages/{page}/locales/{locale}/publish:
    parameters:
      - { name: page, in: path, required: true, schema: { type: string } }
      - { name: locale, in: path, required: true, schema: { type: string, enum: [nl, en] } }
    post:
      tags: [CMS]
      operationId: publishCmsPage
      summary: "Publish a locale"
      description: |
        Step-up required. Creates an immutable revision and switches the public page atomically (public caches are invalidated). Legal pages (privacy, terms, cookie_policy) need `legal_version`, `effective_date` and `approve: true` (422 `legal_approval_required`); a version can be published once (409). The published Terms/Privacy versions become the versions registration requires; earlier acceptances stay as they were. Audited.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                legal_version: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
                effective_date: { type: string, format: date }
                approve: { type: boolean }
            example: {"legal_version": "2026.11", "effective_date": "2026-11-01", "approve": true}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/admin/cms/pages/<id>/locales/nl/publish' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"legal_version":"2026.11","effective_date":"2026-11-01","approve":true}'
      responses:
        '200':
          description: "Published (captured: Terms 2026.11)."
          content:
            application/json:
              example: {"data":{"id":"01m5pyvfp6wz28e8aap1jq5fhy","locale":"nl","number":1,"legal_version":"2026.11","effective_date":"2026-11-01","approved_by":"Sanne","published_by":"Sanne","restored_from":null,"published_at":"2026-10-24T12:40:59+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Not a Super Admin. Audited."
          content:
            application/json:
              example: {"error":{"status":403,"code":"platform_role_required","message":"This action requires a platform administrator.","request_id":"01a16ded-b4c4-70c5-9517-635ccae06f1f"}}
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Nothing to publish, archived, or legal version already used."
          content:
            application/json:
              example: {"error":{"status":409,"code":"draft_revision_conflict","message":"Someone else saved this page in the meantime. Reload to continue.","request_id":"01a16ded-b373-7381-a24b-447c5e87677f","details":{"current_revision":2}}}
        '422':
          description: "Legal approval missing."
          content:
            application/json:
              example: {"error":{"status":422,"code":"legal_approval_required","message":"Legal pages need a version, an effective date and explicit approval to publish.","request_id":"01a16ded-bd90-70ea-862c-334f8f611c32"}}
        '423': { $ref: '#/components/responses/PasswordConfirmationRequired' }

