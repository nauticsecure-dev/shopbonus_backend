            curl -i -b jar -c jar -X POST http://localhost:8000/api/v1/admin/agreement-templates/<template id>/publish \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>"
      responses:
        '200':
          description: "Published."
          content:
            application/json:
              example: {"data":{"id":"01m5mm2r0zjz3qv3ycdnfbp1n1","key":"merchant_agreement","version":"2026.1","locale":"nl","title":"Merchantovereenkomst 2026 (voorbeeld)","body":"# Merchantovereenkomst (VOORBEELDTEKST, geen juridische inhoud)\n\nPartijen: Shopbonus en {{legal_name}} (KvK {{kvk_number}}), gevestigd te {{address}}, handelend onder {{webshop_name}} ({{website_domain}}).","status":"published","requires_reacceptance":true,"published_at":"2026-10-23T14:54:14+00:00","retired_at":null,"created_at":"2026-10-23T14:54:14+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "template_not_draft."
          content:
