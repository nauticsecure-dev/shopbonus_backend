  /api/v1/consumer/profile:
    get:
      tags: [Consumer]
      operationId: consumerProfile
      summary: "Own profile"
      description: |
        The signed-in user's profile: name, verified email, pending email change, phone (E.164), locale, photo URL, factual security status and the three email notification switches. Identity comes from the session only; query parameters such as a user ID are ignored.
        Since B16a `security.two_factor` is `enabled` or `disabled` (TOTP via `/user/two-factor-authentication`); the examples below were captured before B16a and show the former placeholder `not_available`.
      x-access: verified
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/consumer/profile' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Profile."
          content:
            application/json:
              example: {"data":{"id":"01m5n63987h9jnx97myg2ycsny","first_name":"Anna","email":"anna@example.nl","email_verification":"verified","pending_email":null,"phone":null,"locale":"nl","avatar_url":null,"security":{"email_verified":true,"two_factor":"not_available"},"notifications":{"vouchers_discounts":false,"reminders":true,"offers_inspiration":false}}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
        '403': { $ref: '#/components/responses/EmailNotVerified' }
    patch:
      tags: [Consumer]
      operationId: updateConsumerProfile
      summary: "Update own profile"
      description: |
        Partial update of `first_name` (letters, spaces, hyphen, apostrophe; max 60; no HTML), `phone` (any common format, normalised to E.164 with NL default; `null` removes it; stored encrypted) and `locale` (`nl`/`en`). Email, status and role fields are ignored (email has its own verified flow). Invalid input changes nothing. Audited.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, maxLength: 60 }
                phone: { type: string, nullable: true, maxLength: 30 }
                locale: { type: string, enum: [nl, en] }
            example: {"first_name": "Anna", "phone": "06 1234 5678", "locale": "nl"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X PATCH 'http://localhost:8000/api/v1/consumer/profile' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"first_name":"Anna","phone":"06 1234 5678"}'
      responses:
        '200':
          description: "Saved."
          content:
            application/json:
              example: {"data":{"id":"01m5n63987h9jnx97myg2ycsny","first_name":"Anna","email":"anna@example.nl","email_verification":"verified","pending_email":null,"phone":"+31612345678","locale":"nl","avatar_url":null,"security":{"email_verified":true,"two_factor":"not_available"},"notifications":{"vouchers_discounts":false,"reminders":true,"offers_inspiration":false}}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
        '422':
          description: "Invalid name or phone; nothing saved."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a61-b5bd-71ff-b7d4-17354bf1fe35","fields":{"first_name":["The first name field format is invalid."]}}}

  /api/v1/consumer/profile/avatar:
    get:
      tags: [Consumer]
      operationId: avatar
      summary: "Own profile photo"
      description: |
        The signed-in user's own photo (there is no way to request someone else's). `private, max-age=300`, `nosniff`, `default-src 'none'` CSP.
      x-access: verified
      x-codeSamples:
        - lang: curl
          source: |
            curl -o avatar.jpg 'http://localhost:8000/api/v1/consumer/profile/avatar' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "The image (captured: JPEG, Content-Type image/jpeg)."
          content:
            image/jpeg:
              schema: { type: string, format: binary, description: 'Served with the stored type: image/png, image/jpeg or image/webp.' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: "No photo."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"No profile photo.","request_id":"<id>"}}
    post:
      tags: [Consumer]
      operationId: uploadAvatar
      summary: "Upload or replace the profile photo"
      description: |
        PNG, JPEG or WebP; at most 2 MB and 32–4000 px per side; the content must really be an image (SVG and disguised files are refused). Throttled (10/min).
        Stored privately; the database points at the new file only after it was stored, so a storage failure (503 `storage_unavailable`) changes nothing and can be retried. The previous photo is deleted. Audited.
      x-access: verified
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/consumer/profile/avatar' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' -F 'avatar=@me.jpg;type=image/jpeg'
      responses:
        '200':
          description: "Stored; `avatar_url` set."
          content:
            application/json:
              example: {"data":{"id":"01m5n63987h9jnx97myg2ycsny","first_name":"Anna","email":"anna@example.nl","email_verification":"verified","pending_email":null,"phone":"+31612345678","locale":"nl","avatar_url":"http:\/\/127.0.0.1:8789\/api\/v1\/consumer\/profile\/avatar?v=00819dc8","security":{"email_verified":true,"two_factor":"not_available"},"notifications":{"vouchers_discounts":false,"reminders":true,"offers_inspiration":false}}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: "Not an allowed image (captured: an SVG)."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a61-b651-718c-94c8-3e346246af29","fields":{"avatar":["The avatar field must be a file of type: png, jpg, jpeg, webp.","The avatar field must be a file of type: image\/png, image\/jpeg, image\/webp."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: "Storage unavailable; nothing changed (covered by ConsumerProfileTest)."
          content:
            application/json:
              example: {"error":{"status":503,"code":"storage_unavailable","message":"The photo could not be stored. Please try again.","request_id":"<id>"}}
    delete:
      tags: [Consumer]
      operationId: deleteAvatar
      summary: "Remove the profile photo"
      description: |
        Deletes the stored photo; the frontend shows its fallback avatar. Idempotent.
      x-access: verified
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X DELETE 'http://localhost:8000/api/v1/consumer/profile/avatar' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Removed."
          content:
            application/json:
              example: {"data":{"id":"01m5n63987h9jnx97myg2ycsny","first_name":"Anna","email":"anna@example.nl","email_verification":"verified","pending_email":null,"phone":"+31612345678","locale":"nl","avatar_url":null,"security":{"email_verified":true,"two_factor":"not_available"},"notifications":{"vouchers_discounts":false,"reminders":true,"offers_inspiration":false}}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}

  /api/v1/consumer/email-change:
    post:
      tags: [Consumer]
      operationId: requestEmailChange
      summary: "Request a change of the login email"
      description: |
        Needs the current password. Mails a 6-digit code to the **new** address and a security notice to the current one. The login email does not change yet: the account keeps working with the current address (shown as `pending_email` on the profile).
                A new request supersedes the previous one; 60-second cooldown (429 `verification_resend_too_soon`), 10 requests/hour. The address must not belong to another account (422). Audited.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, current_password]
              properties:
                email: { type: string, format: email }
                current_password: { type: string }
            example: {"email": "anna.nieuw@example.nl", "current_password": "<current password>"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/consumer/email-change' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"email":"anna.nieuw@example.nl","current_password":"<current password>"}'
      responses:
        '202':
          description: "Code sent to the new address."
          content:
            application/json:
              example: {"data":{"pending_email":"anna.nieuw@example.nl","expires_at":"2026-10-23T20:19:13+00:00","message":"Enter the code we sent to the new address. Your current address stays active until then."}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
        '422':
          description: "Wrong password, same or taken address."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a61-b95b-70f5-9138-af0a175c35b7","fields":{"current_password":["The provided password is incorrect."]}}}
        '429':
          description: "Cooldown."
          content:
            application/json:
              example: {"error":{"status":429,"code":"verification_resend_too_soon","message":"Please wait before requesting a new code.","request_id":"01a16a61-c331-7044-91ef-8e2ba23288c9","details":{"retry_after_seconds":58}}}
    delete:
      tags: [Consumer]
      operationId: cancelEmailChange
      summary: "Cancel a pending email change"
      description: |
        Invalidates any open code. Idempotent.
      x-access: verified
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X DELETE 'http://localhost:8000/api/v1/consumer/email-change' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "No change pending."
          content:
            application/json:
              example: {"data":{"pending_email":null}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}

  /api/v1/consumer/email-change/confirm:
    post:
      tags: [Consumer]
      operationId: confirmEmailChange
      summary: "Confirm the new login email with the code"
      description: |
        Replaces the login email with the new address and marks it verified (the code proved the mailbox). The code is bound to the user and the new address, expires after 10 minutes, allows 5 wrong attempts and works once.
                Errors: 422 `verification_code_invalid` / `verification_code_expired` / `verification_code_attempts_exceeded`; 409 `email_change_not_pending` (none open, e.g. a reused code). The old address gets a "changed" notice. Audited.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\\d{6}$' }
            example: {"code": "<code from the email>"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/consumer/email-change/confirm' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"code":"<code from the email>"}'
      responses:
        '200':
          description: "Email replaced."
          content:
            application/json:
              example: {"data":{"email":"anna.nieuw@example.nl","email_verification":"verified"}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
        '409':
          description: "Nothing pending (captured: the same code again)."
          content:
            application/json:
              example: {"error":{"status":409,"code":"email_change_not_pending","message":"There is no pending email change.","request_id":"01a16a61-c9cc-70b4-aa4d-892a76697f4d"}}
        '422':
          description: "Wrong, expired or exhausted code."
          content:
            application/json:
              example: {"error":{"status":422,"code":"verification_code_invalid","message":"This code is not valid.","request_id":"01a16a61-c806-7096-bb13-e911f00aa5ab"}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/consumer/preferences:
    get:
      tags: [Consumer]
      operationId: consumerPreferences
      summary: "Email notification switches and preferred categories"
      description: |
        `vouchers_discounts` and `offers_inspiration` are optional marketing (default off; registration opt-in sets `vouchers_discounts`); `reminders` covers reminders about the consumer's own vouchers (default on). Account, security and transactional mail never depend on these.
      x-access: verified
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/consumer/preferences' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Current values."
          content:
            application/json:
              example: {"data":{"notifications":{"vouchers_discounts":false,"reminders":true,"offers_inspiration":false},"categories":[],"mandatory_mail":"Account, security and transaction emails are always sent and do not depend on these settings."}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
    put:
      tags: [Consumer]
      operationId: updateConsumerPreferences
      summary: "Change notification switches and preferred categories"
      description: |
        Each switch is independent; only switches whose value actually changes are recorded, as append-only consent records (purpose, policy version, source `profile`, time, request evidence). `categories` replaces the preferred categories. Favourites, vouchers and history are untouched.
                503 `preferences_unavailable` when no consent policy version is configured. Senders of optional mail must check `CommunicationPreferences::allows()` right before sending.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notifications:
                  type: object
                  additionalProperties: false
                  properties:
                    vouchers_discounts: { type: boolean }
                    reminders: { type: boolean }
                    offers_inspiration: { type: boolean }
                categories: { type: array, maxItems: 12, items: { type: string } }
            example: {"notifications": {"vouchers_discounts": true, "reminders": true, "offers_inspiration": false}, "categories": ["sports_outdoor", "pets"]}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X PUT 'http://localhost:8000/api/v1/consumer/preferences' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"notifications":{"vouchers_discounts":true,"offers_inspiration":false}}'
      responses:
        '200':
          description: "Saved."
          content:
            application/json:
              example: {"data":{"notifications":{"vouchers_discounts":true,"reminders":true,"offers_inspiration":false},"categories":["pets","sports_outdoor"],"mandatory_mail":"Account, security and transaction emails are always sent and do not depend on these settings."}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
        '422':
          description: "Unknown switch or category."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a61-cca9-7198-9df7-e212cc8c58f0","fields":{"notifications":["Unknown notification setting. Allowed: vouchers_discounts, reminders, offers_inspiration."]}}}

