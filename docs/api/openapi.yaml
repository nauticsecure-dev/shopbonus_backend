        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404':
          description: "Unknown banner (or another workspace's)."
          content:
            application/json:
              example: {"error": {"status": 404, "code": "not_found", "message": "Banner not found.", "request_id": "<id>"}}
        '409':
          description: "Stale revision."
          content:
