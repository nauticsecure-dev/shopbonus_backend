  /api/v1/webhooks/{platform}/{token}:
    parameters:
      - { name: platform, in: path, required: true, schema: { type: string } }
      - { name: token, in: path, required: true, description: Opaque connection token from the webhook URL., schema: { type: string } }
    post:
      tags: [Integrations]
      operationId: receiveWebhook
      summary: "Inbound provider webhook (public)"
      description: |
        Called by the shop platform, not by clients. The connector verifies the provider signature over the raw body before anything is trusted or stored. Unknown or disconnected tokens and platform mismatches return 404; a bad signature returns 401 `webhook_rejected` with `details.reason` (invalid_signature, timestamp_out_of_tolerance, shop_mismatch, invalid_event_headers, payload_too_large, not_configured). Verified events are stored once per provider event ID: the first delivery gets 202 and is processed asynchronously; repeats get 200 with `duplicate: true`. 300 requests per minute per connection. Bodies are limited to 1 MB.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific body (WooCommerce REST v3 order, Shopify order, or Shopbonus webhook format v1).
            example: {"order": {"id": "PS-1001", "total_minor": 5995, "currency": "EUR"}}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST https://api.shopbonus.example/api/v1/webhooks/prestashop/<token> \
              -H 'Content-Type: application/json' \
              -H 'X-Shopbonus-Signature: t=<unix>,v1=<hex HMAC-SHA256(secret, "<unix>.<raw body>")>' \
              -H 'X-Shopbonus-Event-Id: evt_01' -H 'X-Shopbonus-Topic: order.paid' \
              --data-binary @order.json
      responses:
        '200':
          description: "Duplicate delivery acknowledged; not reprocessed."
          content:
            application/json:
              example: {"data":{"received":true,"duplicate":true}}
        '202':
          description: "Verified and queued."
          content:
            application/json:
              example: {"data":{"received":true,"duplicate":false,"event_id":"01m5mmqdpyrwt78trs3gc64x0z"}}
        '401':
          description: "Signature or headers invalid."
          content:
            application/json:
              example: {"error":{"status":401,"code":"webhook_rejected","message":"The webhook could not be verified.","request_id":"01a1694b-b6ba-71d1-87a3-9d4babe84347","details":{"reason":"invalid_signature"}}}
        '404':
          description: "Unknown/disconnected token or platform mismatch."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"The requested resource was not found.","request_id":"01a1694b-b8a3-7215-936d-10bce88e346d"}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/workspaces/{workspace}/orders:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      tags: [Orders]
      operationId: orderSheet
      summary: "Live Order Sheet"
      description: |
        Orders of this webshop only. Statuses are separate dimensions: `payment_status` (provider-reported; only `paid` can ever lead to rewards or contact), `ingestion_status` (complete/incomplete with `missing_fields`), `callable` (has a phone), and `eligibility_status`/`contact_status` (filled by Answer24 processing, B07). Amounts are integer minor units. `meta.today` counts orders placed today in the business timezone; revenue is paid orders only, grouped per currency. Customer data is encrypted at rest, so search is by reference prefix, exact external ID or exact email. Live updates: subscribe to the private channel `webshops.{webshop id}.orders` (event `order.updated`, payload `{order_id, payment_status}`, no PII; auth via `POST /api/broadcasting/auth`) and refetch.
      x-access: verified
      x-permission: orders.view
      parameters:
        - { name: payment_status, in: query, required: false, schema: { type: string, enum: [paid, pending, failed, cancelled, refunded, partially_refunded, unknown] } }
        - { name: ingestion_status, in: query, required: false, schema: { type: string, enum: [complete, incomplete] } }
        - { name: platform, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: search, in: query, required: false, description: Reference prefix, exact external order ID or exact customer email (case-insensitive)., schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [placed_at, -placed_at, amount_minor, -amount_minor], default: -placed_at } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/orders?payment_status=paid&sort=-amount_minor' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Paginated orders with today counters."
