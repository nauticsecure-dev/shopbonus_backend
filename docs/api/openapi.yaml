  /api/v1/public/webshops:
    get:
      tags: [Discovery]
      operationId: publicWebshops
      summary: "Discover participating webshops"
      description: |
        Only approved webshops with a published profile; suspended, rejected, draft or unpublished webshops never appear. No internal IDs: webshops are addressed by slug.
                Each card has its categories, `offer_count` and a `featured_offer` (first obtainable offer). Relevance: with a search, name-prefix matches first; otherwise webshops with more active offers first.
                Cached (version-bumped on any profile, offer or webshop status change; stock refreshes within 60 s).
      x-access: public
      security: []
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 }, description: 'Name or short description; % and _ are literal.' }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: has_offers, in: query, required: false, schema: { type: boolean }, description: 'Only webshops with an offer that can be obtained now.' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [relevance, name, newest], default: relevance } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/public/webshops?search=fiets&has_offers=1' \
              -H 'Accept: application/json'
      responses:
        '200':
          description: "Page of webshops."
          content:
            application/json:
              example: {"data":[{"slug":"fietsen-utrecht","name":"Fietsen Utrecht","short_description":"Fietsen, onderdelen en reparatie in Utrecht","logo_url":"http:\/\/127.0.0.1:8788\/api\/v1\/public\/webshops\/fietsen-utrecht\/logo?v=1792785345","categories":[{"key":"sports_outdoor","label":{"nl":"Sport & outdoor","en":"Sports & outdoor"}}],"offer_count":1,"featured_offer":{"slug":"eur10-korting-op-je-volgende-fiets-9taast","title":"\u20ac10 korting op je volgende fiets","summary":"\u20ac10.00 from \u20ac50.00","how_to_obtain":"earn_with_purchase","discount_type":"fixed","discount_value":1000,"currency":"EUR","min_order_minor":5000,"price_minor":null,"ends_at":null,"availability":"available","webshop":{"slug":"fietsen-utrecht","name":"Fietsen Utrecht"}}},{"slug":"woon-co","name":"Woon & Co","short_description":"Meubels en woonaccessoires","logo_url":null,"categories":[{"key":"home_living","label":{"nl":"Wonen","en":"Home & living"}}],"offer_count":1,"featured_offer":{"slug":"15-op-meubels-0wvxcf","title":"15% op meubels","summary":"15%, maximum \u20ac50.00","how_to_obtain":"earn_with_purchase","discount_type":"percentage","discount_value":1500,"currency":"EUR","min_order_minor":null,"price_minor":null,"ends_at":null,"availability":"sold_out","webshop":{"slug":"woon-co","name":"Woon & Co"}}}],"meta":{"current_page":1,"last_page":1,"per_page":10,"total":2}}
        '422':
          description: "Unknown category, per_page above 50, etc."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a55-6bfc-70bc-a404-8ba1ea474f03","fields":{"category":["The selected category is invalid."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/public/webshops/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Discovery]
      operationId: publicWebshop
      summary: "Public webshop profile"
      description: |
        Public profile with description, website and active offers. Never ownership evidence, agreements, orders, members or integration data. 404 `webshop_not_found` when the webshop is not (or no longer) listed.
      x-access: public
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/public/webshops/fietsen-utrecht' \
              -H 'Accept: application/json'
      responses:
        '200':
          description: "Profile and offers."
          content:
            application/json:
              example: {"data":{"slug":"fietsen-utrecht","name":"Fietsen Utrecht","short_description":"Fietsen, onderdelen en reparatie in Utrecht","logo_url":"http:\/\/127.0.0.1:8788\/api\/v1\/public\/webshops\/fietsen-utrecht\/logo?v=1792785345","categories":[{"key":"sports_outdoor","label":{"nl":"Sport & outdoor","en":"Sports & outdoor"}}],"description":"Familiebedrijf sinds 1988.","website_url":"https:\/\/fietsen-utrecht.nl","offers":[{"slug":"eur10-korting-op-je-volgende-fiets-9taast","title":"\u20ac10 korting op je volgende fiets","summary":"\u20ac10.00 from \u20ac50.00","how_to_obtain":"earn_with_purchase","discount_type":"fixed","discount_value":1000,"currency":"EUR","min_order_minor":5000,"price_minor":null,"ends_at":null,"availability":"available","webshop":{"slug":"fietsen-utrecht","name":"Fietsen Utrecht"}}]}}
        '404':
          description: "Not listed."
          content:
            application/json:
              example: {"error":{"status":404,"code":"webshop_not_found","message":"This webshop is not available.","request_id":"01a16a55-6c52-73d0-b824-177c21fce736"}}

  /api/v1/public/webshops/{slug}/logo:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Discovery]
      operationId: publicWebshopLogo
      summary: "Webshop logo"
      description: |
        The logo image of a listed webshop (404 otherwise). `logo_url` in the listings already includes a version parameter, so it changes when the logo does.
        Sent with `X-Content-Type-Options: nosniff`, a `default-src 'none'` CSP and a one-day public cache.
      x-access: public
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -o logo.png 'http://localhost:8000/api/v1/public/webshops/fietsen-utrecht/logo'
      responses:
        '200':
          description: "The image (captured: 471-byte PNG, Content-Type image/png)."
          content:
            image/png:
              schema: { type: string, format: binary, description: 'Served with the stored type: image/png, image/jpeg or image/webp.' }
        '404':
          description: "No such listed webshop or no logo."
          content:
            application/json:
              example: {"error":{"status":404,"code":"webshop_not_found","message":"This webshop is not available.","request_id":"01a16a55-6c52-73d0-b824-177c21fce736"}}

  /api/v1/public/offers:
    get:
      tags: [Discovery]
      operationId: publicOffers
      summary: "Discover offers"
      description: |
        Active offers of listed webshops, ended ones excluded. `availability`: `available`, `sold_out`, `upcoming` (or `expired` on the detail page). `how_to_obtain`: `earn_with_purchase` (merchant reward), `buy_with_wallet` (`price_minor` is the price; wallet units: OPEN-REWARD-UNITS) or `claim`.
                Viewing never reserves a code or touches a wallet.
      x-access: public
      security: []
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: webshop, in: query, required: false, schema: { type: string }, description: Webshop slug. }
        - { name: available, in: query, required: false, schema: { type: boolean }, description: 'Only offers that can be obtained now (started, not ended, a code left, allocation limit not reached).' }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, ending_soon], default: newest } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/public/offers?available=1' \
              -H 'Accept: application/json'
      responses:
        '200':
          description: "Page of offers (captured: one available, one sold out)."
