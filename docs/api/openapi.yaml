  /api/v1/admin/disputes/{dispute}/resolve:
    parameters:
      - { name: dispute, in: path, required: true, schema: { type: string } }
    post:
      tags: [Admin]
      operationId: adminResolveDispute
      summary: "Resolve or reject a report, with one-time compensation"
      description: |
        Step-up required. Compensation is applied at most once, through the normal ledgers:
                - `wallet_credit`: a `WalletService` adjustment with key `dispute:<id>`; needs `amount_minor`;
                - `replacement`: a new voucher from the same offer's inventory;
                - `refund`: a Mollie refund of the purchase's card/bank part with an `Idempotency-Key`; at most what is left to refund.

                A rejected report gets no compensation. A closed report is 409. Audited.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, compensation, note]
              properties:
                outcome: { type: string, enum: [resolved, rejected] }
                compensation: { type: string, enum: [none, wallet_credit, replacement, refund] }
                amount_minor: { type: integer, minimum: 1, description: 'Required for wallet_credit; optional for refund (default: all that is left).' }
                note: { type: string, minLength: 5, maxLength: 1000 }
            example: {"outcome": "resolved", "compensation": "refund", "note": "Invalid code confirmed by the webshop; card payment refunded"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/admin/disputes/<id>/resolve' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"outcome":"resolved","compensation":"refund","note":"..."}'
      responses:
        '200':
          description: "Resolved (captured: refund of the \u20ac9.00 Mollie part)."
          content:
            application/json:
              example: {"data":{"id":"01m5pdr9f7d6zf69g911xryy6x","status":"resolved","reason":"code_invalid","description":"The webshop says this code does not exist.","webshop":"Woon & Co","voucher_id":"01m5pdr4zv96djgyr0ybmg0j51","checkout_id":null,"resolution":{"note":"Invalid code confirmed by the webshop; card payment refunded","compensation":"refund","amount_minor":2000,"at":"2026-10-24T07:42:10+00:00"},"created_at":"2026-10-24T07:42:09+00:00","timeline":[{"by":"consumer","type":"opened","note":null,"at":"2026-10-24T07:42:09+00:00"},{"by":"admin","type":"status_changed","note":"waiting_for_merchant Asked Woon & Co to check the code","at":"2026-10-24T07:42:09+00:00"},{"by":"merchant","type":"merchant_response","note":"This code was not imported correctly, sorry.","at":"2026-10-24T07:42:09+00:00"},{"by":"system","type":"status_changed","note":"under_review","at":"2026-10-24T07:42:09+00:00"},{"by":"admin","type":"resolved","note":"resolved: Invalid code confirmed by the webshop; card payment refunded","at":"2026-10-24T07:42:10+00:00"},{"by":"admin","type":"compensated","note":"refund 2000","at":"2026-10-24T07:42:10+00:00"}]}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Not a Super Admin."
          content:
            application/json:
              example: {"error":{"status":403,"code":"platform_role_required","message":"This action requires a platform administrator.","request_id":"01a16cdc-2a8f-73e0-83ac-09ac69790070"}}
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Already closed: no second compensation."
          content:
            application/json:
              example: {"error":{"status":409,"code":"dispute_closed","message":"This report is already closed.","request_id":"01a16cdc-291a-71fd-9109-e3a9468d574c","details":{"status":"resolved"}}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/PasswordConfirmationRequired' }
        '502':
          description: "Mollie refused or unreachable; nothing recorded."
          content:
            application/json:
              example: {"error":{"status":502,"code":"payment_provider_error","message":"The payment provider refused the request.","request_id":"<id>","details":{"provider_status":422}}}

