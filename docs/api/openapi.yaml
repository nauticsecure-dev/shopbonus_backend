  /api/v1/admin/webshops/{webshop}/members/{user}/revoke:
    parameters:
      - { name: webshop, in: path, required: true, schema: { type: string }, description: Webshop public ID. }
      - { name: user, in: path, required: true, schema: { type: string }, description: User public ID. }
    post:
      tags: [Admin]
      operationId: adminRevokeMembership
      summary: "Revoke a workspace membership"
      description: |
        Recent password required. Removes the membership at once (the user loses the workspace on the next request; a current-workspace selection is cleared). The last active owner is protected (409 `final_owner`): ownership changes go through the ownership workflow. Audited with the reason.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
            example: {"reason": "Verdachte claims, onderzoek loopt"}
      x-codeSamples:
