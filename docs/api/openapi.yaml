              example: {"data":{"slug":"eur10-korting-op-je-volgende-fiets-9taast","title":"\u20ac10 korting op je volgende fiets","summary":"\u20ac10.00 from \u20ac50.00","how_to_obtain":"earn_with_purchase","discount_type":"fixed","discount_value":1000,"currency":"EUR","min_order_minor":5000,"price_minor":null,"ends_at":null,"availability":"available","webshop":{"slug":"fietsen-utrecht","name":"Fietsen Utrecht"},"description":"Geldig op alle fietsen en accessoires.","max_discount_minor":null,"starts_at":null,"redemption_validity_days":90,"categories":[],"products":[],"combinable":false,"terms_version":1}}
