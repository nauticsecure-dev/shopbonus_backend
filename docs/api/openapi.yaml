  /api/v1/integrations/answer24/claims/{claim}/reminders:
    parameters:
      - { name: claim, in: path, required: true, schema: { type: string }, description: 'claim_id returned by the handoff.' }
    post:
      tags: [Answer24 integration]
      operationId: answer24ReminderDecision
      summary: "May Answer24 send the day-30/60/80 claim reminder? (Answer24)"
      description: |
        Scope `answer24.claims`. Answer24 sends reminders; Shopbonus decides once per slot (Trello #10 §6). `send: true` is returned at most once per (claim, day), so repeated queue delivery never sends twice.
                `send: false` reasons: `not_due` (before that day), `superseded` (the next reminder day has started), `already_sent`, `claimed`, `expired` (deadline passed or reservation released), `cancelled`, `suppressed` (customer on the do-not-contact list).
                `day` must be one of 30, 60, 80 (422 otherwise).
      x-access: integration
      security: [{ integrationSignature: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day]
              properties:
                day: { type: integer, enum: [30, 60, 80] }
            example: {"day": 30}
      x-codeSamples:
        - lang: curl
          source: |
            BODY='{"day":30}'; T=$(date +%s)
            SIG=$(printf '%s' "$T.$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $NF}')
            curl -i -X POST 'http://localhost:8000/api/v1/integrations/answer24/claims/01m5n4d2x3f5vpq0snwfybk5mn/reminders' \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H "X-Shopbonus-Key: $KEY_ID" -H "X-Shopbonus-Signature: t=$T,v1=$SIG" -H 'X-Shopbonus-Event-Id: <unique id>' \
              --data-binary "$BODY"
      responses:
        '200':
          description: "Decision (captured after the claim: send=false, reason=claimed)."
          content:
            application/json:
              example: {"data":{"claim_id":"01m5n4gc8vk6t23v5n3xqh5tsm","day":30,"send":false,"reason":"claimed","claim_expires_at":"2027-01-21T19:41:18+00:00"}}
        '401':
          description: "Unknown/revoked key, bad or expired signature (5-minute window). Audited."
          content:
            application/json:
              example: {"error":{"status":401,"code":"integration_signature_invalid","message":"The request signature is missing or invalid.","request_id":"01a16a48-3081-7027-9b84-5d1adad35e88"}}
        '403':
          description: "The key lacks `answer24.claims`."
          content:
            application/json:
              example: {"error":{"status":403,"code":"integration_scope_denied","message":"This integration key may not call this endpoint.","request_id":"01a16a48-3293-73d8-88d2-12c7d4179f40","details":{"required_scope":"answer24.claims"}}}
        '404':
          description: "Unknown claim."
          content:
            application/json:
              example: {"error":{"status":404,"code":"claim_not_found","message":"Claim not found.","request_id":"01a16a48-324f-7292-9b32-d49b5ab6025a"}}
        '422':
          description: "Not a reminder day."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a48-3320-7354-9d56-ff7adb282a03","fields":{"day":["The selected day is invalid."]}}}

  /api/v1/claims/preview:
    post:
      tags: [Claims]
      operationId: previewClaim
      summary: "Preview a voucher claim link"
      description: |
        Public; the token from the claim link is the secret. Throttled per IP (10/min). Shows only the webshop name, the frozen consumer-facing terms and the deadline; never the code or customer data. 404 `claim_not_found` for an unknown token; 410 `claim_already_used`, `claim_expired` or `claim_cancelled`.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 64, description: The last path segment of the claim URL. }
            example: {"token": "<claim-token>"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/claims/preview' \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' -d '{"token":"<claim-token>"}'
      responses:
        '200':
          description: "Claimable."
          content:
            application/json:
              example: {"data":{"status":"open","expires_at":"2027-01-21T19:41:18+00:00","webshop":{"name":"Woon & Co"},"offer":{"name":"\u20ac10 korting","ends_at":null,"summary":"\u20ac10.00 from \u20ac50.00","currency":"EUR","products":[],"categories":[],"combinable":false,"discount_type":"fixed","discount_value":1000,"min_order_minor":5000,"max_discount_minor":null,"public_description":null,"redemption_validity_days":90},"requirements":{"verified_account":true,"email_matches_order":true}}}
        '404':
          description: "Unknown token."
          content:
            application/json:
              example: {"error":{"status":404,"code":"claim_not_found","message":"This claim link is not valid.","request_id":"01a16a48-3374-73b6-b069-283eb179e9f7"}}
        '410':
          description: "Used, expired or cancelled."
          content:
            application/json:
              example: {"error":{"status":410,"code":"claim_already_used","message":"This voucher was already claimed.","request_id":"01a16a48-3480-71b1-9929-76fd949dc598"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/claims/accept:
    post:
      tags: [Claims]
      operationId: acceptClaim
      summary: "Claim the reserved voucher"
      description: |
        Verified, active account whose email equals the order's email (403 `claim_email_mismatch`, audited). Issues the reserved voucher to the account exactly once and returns its code. The same account repeating the call gets the same voucher; anyone else then gets 410 `claim_already_used`. Answer24 is told via the outbox (`answer24.claim_completed`). Throttled per IP.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 64 }
            example: {"token": "<claim-token>"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/claims/accept' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"token":"<claim-token>"}'
      responses:
        '200':
          description: "Voucher issued to this account."
          content:
            application/json:
              example: {"data":{"voucher_id":"01m5n4gc8jpx16113paeaea3cf","status":"issued","code":"WOON-A24-0001","issued_at":"2026-10-23T19:41:19+00:00","expires_at":"2027-01-21T19:41:19+00:00","webshop":{"name":"Woon & Co"},"offer":{"name":"\u20ac10 korting","ends_at":null,"summary":"\u20ac10.00 from \u20ac50.00","currency":"EUR","products":[],"categories":[],"combinable":false,"discount_type":"fixed","discount_value":1000,"min_order_minor":5000,"max_discount_minor":null,"public_description":null,"redemption_validity_days":90}}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a48-3397-71c1-a3d3-a722bdbe6744"}}
        '403':
          description: "Email differs from the order (or `email_not_verified`)."
          content:
            application/json:
              example: {"error":{"status":403,"code":"claim_email_mismatch","message":"Sign in with the email address used for the order to claim this voucher.","request_id":"01a16a48-33ba-7073-a70c-05c629b40d03"}}
        '404':
          description: "Unknown token."
          content:
            application/json:
              example: {"error":{"status":404,"code":"claim_not_found","message":"This claim link is not valid.","request_id":"01a16a48-342b-7134-ae9b-e94849b54073"}}
        '410':
          description: "Already used by someone else, expired or cancelled."
          content:
            application/json:
              example: {"error":{"status":410,"code":"claim_already_used","message":"This voucher was already claimed.","request_id":"01a16a48-3480-71b1-9929-76fd949dc598"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/workspaces/{workspace}/public-profile:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      tags: [Public profile]
      operationId: publicProfile
      summary: "Public discovery profile of this webshop"
      description: |
        What consumers see in discovery, plus `listed` and `listing_blockers` (`profile_not_published`, `webshop_not_approved`). Before the first save `slug` is null and the name defaults to the webshop name.
      x-access: verified
      x-permission: settings.view
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/public-profile' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Profile (captured before the first save)."
          content:
            application/json:
              example: {"data":{"slug":null,"display_name":"Fietsen Utrecht","short_description":null,"description":null,"website_url":null,"categories":[],"has_logo":false,"published":false,"published_at":null,"slug_locked":false,"listed":false,"listing_blockers":["profile_not_published"],"public_url_path":null}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
    put:
      tags: [Public profile]
      operationId: updatePublicProfile
      summary: "Edit and publish the public profile"
      description: |
        Partial update. Text fields are plain text; any HTML is refused (422). Publishing needs a display name, short description and at least one category (422 `public_profile_incomplete` with `details.missing`).
                The slug is generated from the name (readable, unique), may be changed until the first publish, then is fixed (409 `slug_locked`). A published profile is listed only while the webshop is approved. Changes reach the public API immediately (cache version bump). Audited.
      x-access: verified
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 120 }
                short_description: { type: string, maxLength: 160, nullable: true }
                description: { type: string, maxLength: 2000, nullable: true, description: Plain text; HTML is refused. }
                website_url: { type: string, format: uri, nullable: true, description: http(s) only. }
                categories: { type: array, maxItems: 3, items: { type: string, description: 'A key from GET /api/v1/public/categories.' } }
                slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', description: Editable until first publish. }
                published: { type: boolean }
            example: {"short_description": "Fietsen, onderdelen en reparatie in Utrecht", "description": "Familiebedrijf sinds 1988.", "website_url": "https://fietsen-utrecht.nl", "categories": ["sports_outdoor"], "published": true}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X PUT 'http://localhost:8000/api/v1/workspaces/current/public-profile' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"short_description":"Fietsen, onderdelen en reparatie in Utrecht","categories":["sports_outdoor"],"published":true}'
      responses:
        '200':
          description: "Saved (captured: published)."
          content:
            application/json:
              example: {"data":{"slug":"fietsen-utrecht","display_name":"Fietsen Utrecht","short_description":"Fietsen, onderdelen en reparatie in Utrecht","description":"Familiebedrijf sinds 1988.","website_url":"https:\/\/fietsen-utrecht.nl","categories":["sports_outdoor"],"has_logo":false,"published":true,"published_at":"2026-10-23T19:55:44+00:00","slug_locked":true,"listed":true,"listing_blockers":[],"public_url_path":"\/webshops\/fietsen-utrecht"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Lacks settings.manage (captured: employee)."
          content:
            application/json:
              example: {"error":{"status":403,"code":"workspace_permission_denied","message":"You do not have permission to do this in this workspace.","request_id":"01a16a55-69ff-703b-972c-d67613bf0813","details":{"required_permission":"settings.manage"}}}
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "Slug change after first publish."
          content:
            application/json:
              example: {"error":{"status":409,"code":"slug_locked","message":"The public address cannot change after the profile was first published.","request_id":"01a16a55-69ca-714c-912d-581f04d05685"}}
        '422':
          description: "Incomplete for publishing, HTML in text, bad URL/category, or slug taken."
          content:
            application/json:
              example: {"error":{"status":422,"code":"public_profile_incomplete","message":"Complete the public profile before publishing it.","request_id":"01a16a55-68dc-7050-84ed-082a1487bc91","details":{"missing":["short_description","categories"]}}}

  /api/v1/workspaces/{workspace}/public-profile/logo:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      tags: [Public profile]
      operationId: uploadPublicLogo
      summary: "Upload or replace the public logo"
      description: |
        PNG, JPEG or WebP; at most 1 MB and 32–2000 px per side; the content must really be an image (SVG and disguised files are refused).
        The previous file is deleted. Stored privately and served only via GET /api/v1/public/webshops/{slug}/logo. Audited.
      x-access: verified
      x-permission: settings.manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo: { type: string, format: binary }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/public-profile/logo' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' -F 'logo=@logo.png;type=image/png'
      responses:
        '200':
          description: "Stored."
          content:
            application/json:
              example: {"data":{"slug":"fietsen-utrecht","display_name":"Fietsen Utrecht","short_description":"Fietsen, onderdelen en reparatie in Utrecht","description":"Familiebedrijf sinds 1988.","website_url":"https:\/\/fietsen-utrecht.nl","categories":["sports_outdoor"],"has_logo":true,"published":true,"published_at":"2026-10-23T19:55:44+00:00","slug_locked":true,"listed":true,"listing_blockers":[],"public_url_path":"\/webshops\/fietsen-utrecht"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '422':
          description: "Not an allowed image (captured: an SVG)."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a55-6a82-70d3-bc92-59c8c798040f","fields":{"logo":["The logo field must be a file of type: png, jpg, jpeg, webp.","The logo field must be a file of type: image\/png, image\/jpeg, image\/webp."]}}}
        '503':
          description: "Storage unavailable (`storage_unavailable`); nothing changed, safe to retry."
          content:
            application/json:
              example: {"error":{"status":503,"code":"storage_unavailable","message":"The logo could not be stored. Please try again.","request_id":"<id>"}}
    delete:
      tags: [Public profile]
      operationId: deletePublicLogo
      summary: "Remove the public logo"
      description: |
        Deletes the stored file; listings fall back to `logo_url: null`. Idempotent.
      x-access: verified
      x-permission: settings.manage
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X DELETE 'http://localhost:8000/api/v1/workspaces/current/public-profile/logo' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Removed."
          content:
            application/json:
              example: {"data":{"slug":"fietsen-utrecht","display_name":"Fietsen Utrecht","short_description":"Fietsen, onderdelen en reparatie in Utrecht","description":"Familiebedrijf sinds 1988.","website_url":"https:\/\/fietsen-utrecht.nl","categories":["sports_outdoor"],"has_logo":false,"published":true,"published_at":"2026-10-23T19:55:44+00:00","slug_locked":true,"listed":true,"listing_blockers":[],"public_url_path":"\/webshops\/fietsen-utrecht"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }

  /api/v1/public/categories:
    get:
      tags: [Discovery]
      operationId: publicCategories
      summary: "Webshop categories"
