          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/admin/cms/pages?search=voorwaarden' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>'
      responses:
        '200':
          description: "Pages."
          content:
            application/json:
              example: {"data":[{"id":"01m5pyvf2tq5wfm12tbmpp7ge2","key":"voorwaarden","type":"terms","audience":"public","archived":false,"locales":{"nl":{"slug":"algemene-voorwaarden","published":true,"draft_revision":1,"draft_updated_at":"2026-10-24T12:40:59+00:00"}}}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Not a Super Admin. Audited."
          content:
            application/json:
              example: {"error":{"status":403,"code":"platform_role_required","message":"This action requires a platform administrator.","request_id":"01a16ded-b4c4-70c5-9517-635ccae06f1f"}}
    post:
      tags: [CMS]
      operationId: createCmsPage
      summary: "Create a page (drafts per locale)"
      description: |
        Step-up required. Stable `key`, page `type`, `audience`, and an NL and/or EN draft with a localized slug (unique per locale). Content is validated against the strict rich-text schema (422 on unknown nodes, unsafe links, missing CMS images). Audited.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, type, locales]
              properties:
                key: { type: string, pattern: '^[a-z0-9_-]+$' }
                type: { type: string, enum: [privacy, terms, cookie_policy, help, faq, info, landing] }
                audience: { type: string, enum: [public, consumers, merchants] }
                locales:
                  type: object
                  additionalProperties: false
                  properties:
