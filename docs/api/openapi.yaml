  /api/v1/admin/webshops/{webshop}/approve:
    parameters:
      - { name: webshop, in: path, required: true, description: Webshop public ID., schema: { type: string } }
    post:
      tags: [Admin]
      operationId: adminApproveWebshop
      summary: "Approve a webshop"
      description: |
        Step-up: needs a password confirmation within the last 3 hours, from a browser session (423 `password_confirmation_required` otherwise). Requires confirmed business details and the current agreement accepted (409 `agreement_not_accepted`). For a manual review, records ownership as `manual_review`. A flagged duplicate domain claim needs `confirm_duplicate_claim: true` (409 `duplicate_claim_unconfirmed`); it is then approved *without* taking the domain from the other webshop.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, 'null'], maxLength: 500 }
                confirm_duplicate_claim: { type: boolean }
            example: {"confirm_duplicate_claim": true, "reason": "Overname bevestigd met koopovereenkomst."}
      x-codeSamples:
        - lang: curl
          source: |
            # Browser session (bearer tokens are refused for mutations): cookies from /login, then POST /user/confirm-password
            curl -i -b jar -c jar -X POST http://localhost:8000/api/v1/admin/webshops/<webshop id>/approve \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -H 'Content-Type: application/json' -d '{"reason":"KvK extract matches"}'
      responses:
        '200':
          description: "Approved (captured: duplicate claim confirmed; verified_domain stays null)."
          content:
            application/json:
              example: {"data":{"id":"01m5mm2n2ezmg4a8w7jm7cs61k","name":"Fietsen Overname","platform":"shopify","status":"approved","status_reason":"Overname bevestigd met koopovereenkomst.","review_flags":["duplicate_domain_claim"],"ownership_verified":true,"ownership_method":"manual_review","verified_domain":null,"website_domain":"fietsen-utrecht.nl","owners":[{"id":"01m5mm2mtvvzrq38shzrw3rv99","first_name":"Eva","email":"eva@example.nl"}],"review_requested_at":"2026-10-23T14:54:13+00:00","approved_at":"2026-10-23T14:54:15+00:00","created_at":"2026-10-23T14:54:11+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "duplicate_claim_unconfirmed, agreement_not_accepted, business_details_incomplete or invalid_status_transition."
          content:
            application/json:
              example: {"error":{"status":409,"code":"duplicate_claim_unconfirmed","message":"This webshop claims a domain verified by another webshop. Confirm the duplicate claim explicitly to approve.","request_id":"01a16941-63f3-71e8-9830-e0e1d6976359"}}
