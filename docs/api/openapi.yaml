  /api/v1/payments/mollie/webhook:
    post:
      tags: [Payments]
      operationId: mollieWebhook
      summary: "Mollie payment webhook"
      description: |
        Mollie posts only `id` (form-encoded). The body is never trusted: Shopbonus fetches the payment from Mollie and acts on that. The amount, currency and checkout ID must match, or nothing happens and an error is reported.
                - `paid` → finalise exactly once;
                - `failed`, `canceled` or `expired` → release the wallet part and the code;
                - open → nothing.

                Unknown IDs also answer 200, so nothing is revealed and Mollie stops retrying. A malformed ID answers 422.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, pattern: '^tr_[A-Za-z0-9]+$' }
            example: {"id": "tr_WDqYK6vllg"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/payments/mollie/webhook' -d 'id=tr_WDqYK6vllg'
      responses:
        '200':
          description: "Handled (also for unknown IDs)."
          content:
            application/json:
              example: {"data":{"received":true}}
        '422':
          description: "Not a payment ID."
          content:
            application/json:
              example: {"error":{"status":422,"code":"invalid_payment_id","message":"Invalid payment ID.","request_id":"01a16cd4-42a3-719e-93ec-5df4b757859b"}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

