  /api/v1/admin/cockpit:
    get:
      tags: [Admin]
      operationId: adminCockpit
      summary: "Cockpit KPIs, trends and attention lists"
      description: |
        Figures computed from the real tables (no estimates). `definitions` states what each counter means; pending and confirmed amounts are always separate (affiliate commissions per status, wallet `pending` apart from `outstanding`). Period boundaries are days in the business timezone; custom ranges up to 366 days (422 `range_too_long`). `trends.days` holds daily counts (new webshops, new consumers, paid orders, vouchers issued and redeemed). `attention` lists records that need a human, with public IDs: pending approvals, integration failures, failed jobs, open reconciliation flags, paid-unfulfilled checkouts, affiliate problems, access denials of the last 24 h by route, and recent admin actions. Cached 60 s per period (`generated_at`, `cache_seconds`).
