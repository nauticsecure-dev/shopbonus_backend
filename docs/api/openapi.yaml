        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/admin/cockpit?period=7d' -b cookies.txt \
