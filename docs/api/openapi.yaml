            example: {"revision": 1, "config": {"template": "ribbon", "placement": {"anchor": "top"}, "content": {"heading": "Besteed €100, krijg €10", "subtitle": "Voor je volgende aankoop", "cta_label": "Meer info", "cta_url": "https://www.woonenco.nl/shopbonus", "terms": "Min. besteding €100", "image_asset_id": "01m5py5v603t7kwb89trg52nrq"}, "style": {"background": "#1D4ED8", "text": "#FFFFFF", "font": "inter", "animation": "fade_in"}, "devices": ["desktop", "mobile"], "frequency": {"per_session": 1, "cooldown_hours": 24, "hide_after_dismiss": true}, "triggers": {"all": [{"type": "url_match", "value": "/collections/*"}, {"type": "category", "value": ["fashion"]}, {"type": "min_seconds", "value": 20}]}}}
