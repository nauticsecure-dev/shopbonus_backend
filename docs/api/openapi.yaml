              example: {"error":{"status":403,"code":"platform_role_required","message":"This action requires a platform administrator.","request_id":"01a16cc9-6a37-7048-a6fc-67761beca117"}}
    post:
      tags: [Admin]
      operationId: createAffiliateConnection
      summary: "Connect an affiliate network"
      description: |
        Step-up required. Credentials are validated per network (Daisycon: `publisher_id`, `access_token`, `media_id`; TradeTracker: `customer_id`, `passphrase`, `site_id`), stored encrypted and tested immediately (401/403 from the network → `reauthentication_required`).
