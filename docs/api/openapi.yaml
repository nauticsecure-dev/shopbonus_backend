  /api/v1/admin/cms/pages/{page}/locales/{locale}:
    parameters:
      - { name: page, in: path, required: true, schema: { type: string } }
      - { name: locale, in: path, required: true, schema: { type: string, enum: [nl, en] } }
    put:
      tags: [CMS]
      operationId: saveCmsDraft
      summary: "Save a locale draft"
      description: |
        Step-up required. Drafts never change public content. Optimistic locking with `revision` (409 `draft_revision_conflict` with the current revision: never silently overwritten). A new locale needs `slug`.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, content]
              properties:
                revision: { type: integer }
                slug: { type: string }
                content:
                  type: object
                  required: [title, body]
                  properties:
                    title: { type: string, maxLength: 120 }
                    seo_title: { type: string, maxLength: 70 }
                    seo_description: { type: string, maxLength: 160 }
                    body: { type: object, description: 'Rich-text document: {type: doc, content: [...]} with nodes paragraph, heading (level 2-4), bulletList, orderedList, listItem, text (marks bold, italic, link{href https or /relative}), image {asset_id, alt}, button {label, href}. Anything else is 422; there is no HTML.' }
            example: {"revision": 1, "content": {"title": "Zo werkt ShopBonus (concept)", "body": {"type": "doc", "content": [{"type": "heading", "attrs": {"level": 2}, "content": [{"type": "text", "text": "Sparen"}]}, {"type": "paragraph", "content": [{"type": "text", "text": "Nieuwe tekst."}, {"type": "text", "text": " Lees meer", "marks": [{"type": "link", "attrs": {"href": "/hulp"}}]}]}]}}}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X PUT 'http://localhost:8000/api/v1/admin/cms/pages/<id>/locales/nl' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"revision":1,"content":{...}}'
      responses:
        '200':
          description: "Saved."
          content:
            application/json:
              example: {"data":{"locale":"nl","slug":"hoe-het-werkt","draft_revision":2}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Not a Super Admin. Audited."
          content:
            application/json:
              example: {"error":{"status":403,"code":"platform_role_required","message":"This action requires a platform administrator.","request_id":"01a16ded-b4c4-70c5-9517-635ccae06f1f"}}
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Stale revision."
          content:
