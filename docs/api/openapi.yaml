      operationId: resolveAffiliateTransaction
      summary: "Resolve a conversion in review"
      description: |
        Step-up required; a note is mandatory. `link_click` attaches an attributable click of the same webshop (then rewards follow the rules), `accept` releases a disputed one (e.g. above the review threshold), `reject` closes it with no reward. Only `unmatched`, `disputed` or `tracked` conversions (409 otherwise). Audited.
