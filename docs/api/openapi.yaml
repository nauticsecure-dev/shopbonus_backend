  /api/v1/consumer/checkouts:
    post:
      tags: [Consumer]
      operationId: startCheckout
      summary: "Buy a voucher (wallet, Mollie or both)"
      description: |
        Wallet-only (`payment_part_minor` 0): the wallet debit, the code allocation and the voucher issuance happen in one transaction, and the response is `completed`. Any failure rolls all of it back.
                Otherwise the wallet part and one code are reserved (bounded) and a Mollie payment is created; send the consumer to `payment.checkout_url`. The voucher is issued only after the Mollie webhook and a server-side check say `paid`; returning from Mollie proves nothing.
                A repeat with the same `Idempotency-Key` returns the same checkout (200). 409 `checkout_blocked` (with the quote blockers) or `offer_out_of_stock` (lost a race for the last code; nothing changed). Mollie runs in test mode only (`MOLLIE_ALLOW_LIVE`). No code is ever in this response: it appears in My Vouchers.
      x-access: verified
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 }, description: 'Unique per purchase attempt; a repeat returns the same checkout.' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer]
              properties:
                offer: { type: string, description: Offer slug (public discovery). }
                use_wallet: { type: boolean, default: true, description: Pay as much as possible from the eur_credit wallet. }
            example: {"offer": "eur25-korting-op-meubels-air4ck"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/consumer/checkouts' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' -H 'Idempotency-Key: checkout-2026-10-24-0001' \
              -H 'Content-Type: application/json' -d '{"offer":"<offer slug>"}'
      responses:
        '201':
          description: "Started (captured: \u20ac11.00 wallet + \u20ac9.00 Mollie)."
          content:
            application/json:
              example: {"data":{"id":"01m5pd8g6jxyja6prwr6bcwm98","state":"pending_payment","offer":{"slug":"eur25-korting-op-meubels-air4ck","title":"\u20ac25 korting op meubels"},"price_minor":2000,"wallet_part_minor":1100,"payment_part_minor":900,"currency":"EUR","payment":{"provider":"mollie","status":"open","test_mode":true,"checkout_url":"https:\/\/www.mollie.com\/checkout\/select-method\/f3b34a800b"},"voucher_id":null,"failure_reason":null,"expires_at":"2026-10-24T08:03:31+00:00","completed_at":null}}
        '200':
          description: "Same Idempotency-Key: same checkout."
          content:
            application/json:
              example: {"data":{"id":"01m5pd8fzpy18bajpnwcqnkecz","state":"completed","offer":{"slug":"eur25-korting-op-meubels-air4ck","title":"\u20ac25 korting op meubels"},"price_minor":2000,"wallet_part_minor":2000,"payment_part_minor":0,"currency":"EUR","payment":null,"voucher_id":"01m5pd8g05ak30hy67ndss1s4v","failure_reason":null,"expires_at":"2026-10-24T08:03:31+00:00","completed_at":"2026-10-24T07:33:31+00:00"}}
        '400':
          description: "Idempotency-Key missing or malformed."
          content:
            application/json:
              example: {"error":{"status":400,"code":"idempotency_key_required","message":"Send a unique Idempotency-Key header (8\u2013100 characters) with each purchase.","request_id":"01a16cd4-4093-72b1-9983-a1d986b110fc"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: "Blocked, sold out or payments unavailable."
          content:
            application/json:
              example: {"error":{"status":409,"code":"checkout_blocked","message":"This voucher cannot be bought right now.","request_id":"<id>","details":{"blockers":["sold_out"]}}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: "Mollie unreachable or refused (`payment_provider_unavailable` / `payment_provider_error`); the reservations were released."
          content:
            application/json:
              example: {"error":{"status":502,"code":"payment_provider_unavailable","message":"The payment provider could not be reached. Please try again.","request_id":"<id>"}}

