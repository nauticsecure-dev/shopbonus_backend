  /api/v1/workspaces/{workspace}/banners/{banner}/simulate:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: banner, in: path, required: true, schema: { type: string } }
    post:
      tags: [Banners]
      operationId: simulateBanner
      summary: "Why shown / hidden (simulation)"
      description: |
        Evaluates the draft's rules against a visitor context and lists the reasons; results are marked `simulated`. Checkout/payment/account pages are always excluded. Without a verified `cart_total_minor` a cart-progress banner falls back to a static offer (no fake progress).
      x-access: verified
      x-permission: offers.view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                category: { type: string }
                product_sku: { type: string }
                seconds: { type: integer }
                scroll_pct: { type: integer }
                exit_intent: { type: boolean }
                device: { type: string, enum: [desktop, tablet, mobile] }
                language: { type: string }
                local_time: { type: string, format: date-time }
                visitor: { type: string, enum: [first, returning] }
                shown_this_session: { type: integer }
                last_shown_at: { type: string, format: date-time }
                dismissed: { type: boolean }
                cart_total_minor: { type: integer, nullable: true }
            example: {"path": "/collections/jurken", "category": "fashion", "seconds": 25, "device": "desktop"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/banners/<id>/simulate' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"path":"/collections/jurken","category":"fashion","seconds":25}'
      responses:
        '200':
          description: "Decision with reasons."
          content:
            application/json:
              example: {"data":{"shown":true,"reasons":["matched: url_match \/collections\/*","matched: category fashion","matched: min_seconds 20","shown"],"cart_progress":null,"fallback":null,"simulated":true}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404':
          description: "Unknown banner (or another workspace's)."
          content:
            application/json:
              example: {"error": {"status": 404, "code": "not_found", "message": "Banner not found.", "request_id": "<id>"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }

