        - { name: filter, in: query, required: false, schema: { type: string, enum: [all, active, used, expired, cancelled], default: all } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/consumer/vouchers?filter=active' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Own vouchers."
