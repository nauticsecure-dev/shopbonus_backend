        - { name: action, in: query, required: false, schema: { type: string }, description: 'Prefix match, e.g. `workspace.`' }
        - { name: webshop_id, in: query, required: false, schema: { type: string } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
