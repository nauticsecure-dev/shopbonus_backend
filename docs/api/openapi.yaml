  /api/v1/workspaces/{workspace}/funding/top-ups:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    post:
      tags: [Funding]
      operationId: startTopUp
      summary: "Top up via Mollie (iDEAL)"
      description: |
        Creates a Mollie iDEAL payment (test mode only; `MOLLIE_ALLOW_LIVE`) and returns its `checkout_url`. The funding wallet is credited once, after Mollie's webhook and a server-side check of the payment (amount, currency, top-up ID). Requires a commercially active webshop. €10–€10,000 per top-up. Captured against a local Mollie test-mode stub.
      x-access: verified
      x-permission: finance.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, minimum: 1000, maximum: 1000000 }
            example: {"amount_minor": 50000}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/funding/top-ups' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"amount_minor":50000}'
      responses:
        '201':
          description: "Payment created."
          content:
            application/json:
              example: {"data":{"id":"01m5pefpna4hvspc2gxpg25yhk","state":"pending","amount_minor":50000,"currency":"EUR","checkout_url":"https:\/\/www.mollie.com\/checkout\/select-method\/861cd71ef5","paid_at":null}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "`payments_unavailable` (no test key)."
          content:
            application/json:
              example: {"error":{"status":409,"code":"payments_unavailable","message":"Online payment is not available right now.","request_id":"<id>"}}
        '422':
          description: "Amount out of range."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16ce7-da5a-739d-9127-9528c6522252","fields":{"amount_minor":["The amount minor field must be at least 1000."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

