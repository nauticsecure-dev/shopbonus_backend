        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a6f-b001-7195-a525-f98115037cb5"}}
        '404':
          description: "Not one of yours."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"Transaction not found.","request_id":"01a16a6f-af92-704c-bcf6-ce5167d38dc4"}}

  /api/v1/public/webshops/{slug}/visit:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Discovery]
      operationId: visitWebshop
      summary: "Visit webshop (affiliate redirect)"
      description: |
        Records a click and answers 302 to the selected network's own tracking link, with an opaque 20-character click reference as the network sub ID (Trello #19 "Tracked consumer journey"). A click never earns anything.
        A signed-in, verified consumer (session or bearer) is attributed; an anonymous visit is tracked but not attributed. Without a usable affiliate program it redirects to the webshop's website and records nothing. Unlisted webshop: 404. Throttled (30/min per IP).
      x-access: public
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -i 'http://localhost:8000/api/v1/public/webshops/fietsen-utrecht/visit' -H 'Authorization: Bearer <consumer token>'
      responses:
        '302':
          description: "Redirect (captured: through TradeTracker; `Location: https://tc.tradetracker.net/?c=1&m=2&a=3&r=<click reference>`)."
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              example: {}
        '404':
          description: "Webshop not listed."
          content:
            application/json:
              example: {"error":{"status":404,"code":"webshop_not_found","message":"This webshop is not available.","request_id":"<id>"}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/affiliate/postback/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: 'Secret postback token, shown once when the connection is created.' }
    get:
      tags: [Affiliate]
      operationId: affiliatePostbackGet
      summary: "Network conversion postback (GET form)"
      description: |
        Same as the POST form, with the network's fields as query parameters (many networks send postbacks as GET pings). Untrusted: it can only record `tracked`.
      x-access: public
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -i 'http://localhost:8000/api/v1/affiliate/postback/<postback token>?ID=TT-1003&campaign[ID]=T1&reference=<click reference>&commission=2.00&transactionStatus=accepted'
      responses:
        '202':
          description: "Recorded (same handling as POST; captured via POST)."
          content:
            application/json:
              example: {"data":{"received":true,"status":"disputed"}}
        '404':
          description: "Unknown token."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"Unknown postback endpoint.","request_id":"<id>"}}
    post:
      tags: [Affiliate]
      operationId: affiliatePostback
      summary: "Network conversion postback"
      description: |
        Untrusted conversion ping (GET or POST, network-format fields). It can record a new conversion as `tracked` (or `unmatched`/`disputed`), but it never approves, credits or changes a conversion that the network API or an import already reported. Rewards need a trusted sync or import. Unknown token: 404; unreadable payload: 422. Throttled like webhooks.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The network's own postback fields (TradeTracker shown).
            example: {"ID": "TT-1003", "campaign": {"ID": "T1"}, "reference": "<click reference>", "orderID": "ORD-3", "orderAmount": "79.95", "commission": "2.00", "transactionStatus": "accepted", "registrationDate": "2026-10-24T07:21:40Z", "assessmentDate": "2026-10-24T09:00:00Z"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/affiliate/postback/<postback token>' \
              -H 'Content-Type: application/json' -d '{"ID":"TT-1003","campaign":{"ID":"T1"},...}'
      responses:
        '202':
          description: "Recorded (captured: a second report of an already credited click \u2192 disputed duplicate)."
          content:
            application/json:
              example: {"data":{"received":true,"status":"disputed"}}
        '404':
          description: "Unknown token."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"Unknown postback endpoint.","request_id":"01a16cc9-6688-7352-bcfd-6f6d16fb0655"}}
        '422':
          description: "Unreadable payload."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16cc9-6136-70a1-8b19-98be08e2e621","fields":{"publisher_id":["The publisher id field format is invalid."],"access_token":["The access token field is required."],"media_id":["The media id field is required."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

