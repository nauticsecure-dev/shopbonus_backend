  /api/v1/banners/editor/pair:
    post:
      tags: [Banner embed]
      operationId: bannerEditorPair
      summary: "Exchange a pairing token (from the shop origin)"
      description: |
        From the origin the pairing token was issued for, once, within 10 minutes: returns a 30-minute editor token that can only read and save drafts of that webshop's banners. Wrong origin, replay or expiry → 401 `pairing_invalid`.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_token]
              properties:
                pairing_token: { type: string }
            example: {"pairing_token": "<pairing token>"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/banners/editor/pair' \
              -H 'Accept: application/json' -H 'Origin: https://www.woonenco.nl' \
              -H 'Content-Type: application/json' -d '{"pairing_token":"<pairing token>"}'
      responses:
        '200':
          description: "Editor token."
          content:
            application/json:
              example: {"data":{"editor_token":"<editor token>","expires_in":1800,"scope":"banner_drafts"}}
        '401':
          description: "Invalid, used, expired or wrong origin."
          content:
            application/json:
              example: {"error":{"status":401,"code":"pairing_invalid","message":"This pairing link is not valid any more. Start the editor again from ShopBonus.","request_id":"01a16de2-f3ce-720c-9977-4d02e7cc7193"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/banners/editor/campaigns/{banner}:
    parameters:
      - { name: banner, in: path, required: true, schema: { type: string } }
    get:
      tags: [Banner embed]
