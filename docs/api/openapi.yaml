      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
              example: {"data": {"id": "01m5mj7namw3ysnwzvha9rkbxf", "name": "Fietsenwinkel Utrecht Centrum", "platform": "woocommerce", "status": "draft", "commercially_active": false, "is_current": true, "membership": {"role": "owner", "permissions": ["dashboard.view", "orders.view", "orders.manage", "integrations.view", "integrations.manage", "offers.view", "offers.manage", "vouchers.view", "vouchers.manage", "team.view", "team.manage", "settings.view", "settings.manage", "finance.view", "finance.manage", "agreements.accept", "ownership.manage"], "joined_at": "2026-10-23T14:21:58+00:00"}, "created_at": "2026-10-23T14:21:58+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
