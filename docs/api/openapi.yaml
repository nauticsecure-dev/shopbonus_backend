                requires_reacceptance: { type: boolean, default: true, description: Whether approved webshops must accept this version before further commercial actions. }
            example: {"title": "Merchantovereenkomst 2026"}
      x-codeSamples:
        - lang: curl
          source: |
            # Browser session (bearer tokens are refused for mutations): cookies from /login, then POST /user/confirm-password
            curl -i -b jar -c jar -X PATCH http://localhost:8000/api/v1/admin/agreement-templates/<template id> \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -H 'Content-Type: application/json' -d '{"title":"Merchantovereenkomst 2026"}'
      responses:
        '200':
          description: "Updated."
          content:
            application/json:
              example: {"data":{"id":"01m5mm2r0zjz3qv3ycdnfbp1n1","key":"merchant_agreement","version":"2026.1","locale":"nl","title":"Merchantovereenkomst 2026 (voorbeeld)","body":"# Merchantovereenkomst (VOORBEELDTEKST, geen juridische inhoud)\n\nPartijen: Shopbonus en {{legal_name}} (KvK {{kvk_number}}), gevestigd te {{address}}, handelend onder {{webshop_name}} ({{website_domain}}).","status":"draft","requires_reacceptance":true,"published_at":null,"retired_at":null,"created_at":"2026-10-23T14:54:14+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "template_not_draft."
          content:
            application/json:
              example: {"error":{"status":409,"code":"template_not_draft","message":"Published templates cannot be edited. Create a new version.","request_id":"01a16941-610e-7070-be16-be7ea6648b06"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/PasswordConfirmationRequired' }

  /api/v1/admin/agreement-templates/{template}/publish:
    parameters:
      - { name: template, in: path, required: true, description: Template public ID., schema: { type: string } }
    post:
      tags: [Admin]
      operationId: adminPublishAgreementTemplate
      summary: "Publish a draft version"
      description: |
        Step-up required. Freezes the text and retires the previously published version of the same key and locale. If `requires_reacceptance`, approved webshops are blocked from commercial actions (403 `agreement_reacceptance_required`) until they accept it.
