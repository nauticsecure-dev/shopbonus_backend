      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, note]
              properties:
                action: { type: string, enum: [link_click, accept, reject] }
                click_reference: { type: string, description: Required for link_click. }
                note: { type: string, maxLength: 255 }
            example: {"action": "reject", "note": "No click reference; customer not identifiable"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/admin/affiliate/transactions/{id}/resolve' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"action":"reject","note":"..."}'
      responses:
        '200':
          description: "Resolved."
