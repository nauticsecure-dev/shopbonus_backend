  /api/v1/workspaces/{workspace}/offers/{offer}/codes:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: offer, in: path, required: true, schema: { type: string } }
    get:
      tags: [Offers]
      operationId: listCodes
      summary: "Code sheet of an offer"
      description: |
        Codes are masked (`****` + last 4); the full value needs the audited reveal. `meta.counters` counts every status, so the sum always equals `total` (reserved, issued, redeemed and expired codes never disappear or count as available). `assigned` shows the live voucher (origin, status, masked consumer, expiries). `platform_validation` is `merchant_verification_required` until a platform coupon check exists: importing a code never proves the shop accepts it.
      x-access: verified
      x-permission: vouchers.view
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [available, reserved, issued, redeemed, expired, invalid, cancelled] } }
        - { name: batch, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, description: Exact code (case-insensitive)., schema: { type: string } }
        - { name: assigned, in: query, required: false, description: Has a live (reserved/issued/redeemed) voucher., schema: { type: boolean } }
        - { name: platform_validation, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [created_at, -created_at, status, -status] } }
        - { name: per_page, in: query, required: false, schema: { type: integer, maximum: 200, default: 50 } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/offers/<offer id>/codes?status=available' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Codes with counters."
