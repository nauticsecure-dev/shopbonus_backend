  /api/v1/workspaces/{workspace}/connections/{connection}/events/{event}/retry:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: connection, in: path, required: true, schema: { type: string } }
      - { name: event, in: path, required: true, schema: { type: string } }
    post:
      tags: [Integrations]
      operationId: retryWebhookEvent
      summary: "Retry a failed event"
      description: |
        Re-queues a `failed` event whose payload is still retained (14 days). Other events: 409 `event_not_retryable`. Audited.
      x-access: verified
      x-permission: integrations.manage
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/connections/<id>/events/<event id>/retry' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '202':
          description: "Re-queued (captured: the payload was still invalid JSON, so the retry ran and failed again)."
          content:
            application/json:
              example: {"data":{"id":"01m5mndypk7pjesy520sztrypa","status":"failed"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "Not failed, or payload pruned."
          content:
            application/json:
              example: {"error":{"status":409,"code":"event_not_retryable","message":"Only failed events with a retained payload can be retried.","request_id":"01a16955-54bc-709c-ade8-6daa811743f2"}}

  /api/v1/workspaces/{workspace}/offers:
    parameters:
