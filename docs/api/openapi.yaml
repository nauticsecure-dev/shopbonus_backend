      description: |
        The webshop's funding wallet for sponsored rewards (Trello #24 §4): `available_minor` can fund new rewards; `reserved_minor` is held for reserved/issued vouchers (reward + 30% fee each); `settled_minor` was billed at redemption; `released_minor` came back from vouchers that lapsed. Fixed rewards use the reward as fee basis; percentage rewards use the maximum discount (`fee_basis.percentage`, provisional: OPEN-PERCENT-REWARD-FEE-BASIS). With `funding_required`, new sponsored vouchers need funding. Not withdrawable.
      x-access: verified
      x-permission: finance.view
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/funding' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Balances (captured after one redemption)."
          content:
            application/json:
              example: {"data":{"currency":"EUR","available_minor":47400,"reserved_minor":1300,"settled_minor":1300,"released_minor":0,"topped_up_minor":50000,"obligations":{"reserved":1,"settled":1,"released":0},"fee_rate_bps":3000,"fee_basis":{"fixed":"reward","percentage":"maximum_discount"},"funding_required":true,"withdrawable":false}}
