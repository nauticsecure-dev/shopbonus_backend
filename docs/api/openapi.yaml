  /api/v1/consumer/privacy/deletion-request:
    post:
      tags: [Consumer]
      operationId: requestAccountDeletion
      summary: "Request account deletion"
      description: |
        Records a deletion request (current password + `confirm: true`). Nothing is deleted by this call: processing is a controlled step that keeps records required by law (vouchers, payments, audit; D-013). One open request at a time (409). Throttled. Audited.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, confirm]
              properties:
                current_password: { type: string }
                confirm: { type: boolean, const: true }
            example: {"current_password": "<current password>", "confirm": true}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/consumer/privacy/deletion-request' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"current_password":"<current password>","confirm":true}'
      responses:
        '202':
          description: "Recorded."
          content:
            application/json:
              example: {"data":{"id":"01m5n63pn10404cq8kqwab9zba","type":"deletion","status":"open","requested_at":"2026-10-23T20:09:20+00:00","completed_at":null,"message":"Your request was recorded and will be handled by Shopbonus. Records we must keep by law (vouchers, payments, audit) are retained for their legal period."}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a61-e97f-707e-a1aa-cb3eb61e4c12"}}
        '409':
          description: "Already requested."
          content:
            application/json:
              example: {"error":{"status":409,"code":"deletion_already_requested","message":"A deletion request is already being processed.","request_id":"01a16a61-e416-71c0-a2dc-f0536c5e6ad6"}}
        '422':
          description: "Wrong password or not confirmed."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a61-d259-7214-a24d-e7c9e0a534c4","fields":{"current_password":["The provided password is incorrect."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

