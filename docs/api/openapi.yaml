        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name: { type: string, maxLength: 120 }
                offer_id: { type: string, nullable: true }
                config:
                  type: object
                  required: [template, placement, content, style, devices, frequency, triggers]
                  description: 'Strict schema (BannerConfig): plain text only, https links, hex colours, images only from this webshop''s uploaded assets.'
                  properties:
                    template: { type: string, enum: [ribbon, inline_card, floating, teaser, popup, exit_intent, cart_progress] }
                    placement: { type: object, properties: { anchor: { type: string, enum: [top, bottom, top_left, top_right, bottom_left, bottom_right, inline] }, offset_x: { type: integer }, offset_y: { type: integer }, selector_hint: { type: string } } }
                    content: { type: object, properties: { heading: { type: string, maxLength: 80 }, subtitle: { type: string, maxLength: 160 }, cta_label: { type: string, maxLength: 30 }, cta_url: { type: string, format: uri }, terms: { type: string, maxLength: 200 }, image_asset_id: { type: string } } }
                    style: { type: object, properties: { background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }, text: { type: string }, accent: { type: string }, font: { type: string, enum: [system, inter, roboto, open_sans, lato, montserrat] }, animation: { type: string, enum: [none, fade_in, slide_in] }, radius: { type: integer } } }
                    devices: { type: array, items: { type: string, enum: [desktop, tablet, mobile] } }
                    frequency: { type: object, properties: { per_session: { type: integer, minimum: 1, maximum: 10 }, cooldown_hours: { type: integer }, hide_after_dismiss: { type: boolean } } }
                    priority: { type: integer }
