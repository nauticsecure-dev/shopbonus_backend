      x-access: verified
      x-permission: team.view
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET http://localhost:8000/api/v1/workspaces/current/members \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Members."
          content:
            application/json:
              example: {"data":[{"id":"01m5mjvnc2qm5v4trb0y8pcbh5","first_name":"Jan","email":"jan@example.nl","role":"owner","permissions":["dashboard.view","orders.view","orders.manage","integrations.view","integrations.manage","offers.view","offers.manage","vouchers.view","vouchers.manage","team.view","team.manage","settings.view","settings.manage","finance.view","finance.manage","agreements.accept","ownership.manage"],"granted_permissions":[],"status":"active","joined_at":"2026-10-23T14:32:53+00:00","last_activity_at":"2026-10-23T14:32:53+00:00"},{"id":"01m5mjvnc7d8cm4qahhag2pvjw","first_name":"Mia","email":"mia@example.nl","role":"manager","permissions":["dashboard.view","orders.view","orders.manage","integrations.view","integrations.manage","offers.view","offers.manage","vouchers.view","vouchers.manage","team.view","team.manage","settings.view","settings.manage","finance.view"],"granted_permissions":[],"status":"active","joined_at":"2026-10-23T14:32:53+00:00","last_activity_at":null},{"id":"01m5mjvnc9bchqs7612nwyczba","first_name":"Piet","email":"piet@example.nl","role":"employee","permissions":["dashboard.view","orders.view"],"granted_permissions":["orders.view"],"status":"active","joined_at":"2026-10-23T14:32:53+00:00","last_activity_at":null}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }

  /api/v1/workspaces/{workspace}/members/{member}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: member, in: path, required: true, description: The member's user public ID., schema: { type: string } }
    patch:
      tags: [Workspaces]
      operationId: updateMember
      summary: "Change a member's role or grants"
      description: |
        Rules: no changes to yourself; owners are never targets; you must outrank the member; the new role can't be `owner` or above your own; grants must be permissions you hold (owner-only permissions are never grantable). Sending `permissions` replaces the explicit grants. Audited as `team.member_updated` with before/after.
      x-access: verified
      x-permission: team.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [manager, employee] }
                permissions: { type: array, items: { type: string } }
            example: {"permissions": ["orders.view", "vouchers.view"]}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X PATCH http://localhost:8000/api/v1/workspaces/current/members/<user id> \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"permissions":["orders.view","vouchers.view"]}'
      responses:
        '200':
          description: "Updated (captured as manager Mia changing employee Piet)."
          content:
            application/json:
              example: {"data":{"id":"01m5mjvnc9bchqs7612nwyczba","first_name":"Piet","email":"piet@example.nl","role":"employee","permissions":["dashboard.view","orders.view","vouchers.view"],"granted_permissions":["orders.view","vouchers.view"],"status":"active","joined_at":"2026-10-23T14:32:53+00:00","last_activity_at":null}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Authority rule violated: cannot_manage_self, owner_not_manageable, member_not_below_you, owner_role_not_grantable, role_above_own, permission_above_own, or missing team.manage."
          content:
            application/json:
              example: {"error":{"status":403,"code":"cannot_manage_self","message":"You cannot change your own membership this way.","request_id":"01a1692d-dc60-73b7-bc92-8857d1f110a2"}}
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '422':
          description: "Unknown permission (unknown_permission) or invalid role."
          content:
            application/json:
              example: {"error":{"status":422,"code":"unknown_permission","message":"Unknown permission.","request_id":"01a1692d-da81-7319-97b2-08f6d404d9da","details":{"permission":"root.everything"}}}
    delete:
      tags: [Workspaces]
      operationId: removeMember
      summary: "Remove a member"
      description: |
        Access ends on the member's next request; their current-workspace selection is cleared. Same authority rules as PATCH; owners can't be removed here. Audited as `team.member_removed`.
      x-access: verified
      x-permission: team.manage
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X DELETE http://localhost:8000/api/v1/workspaces/current/members/<user id> \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '204':
          description: "Removed."
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Authority rule violated (captured: a manager trying to remove the owner)."
          content:
            application/json:
              example: {"error":{"status":403,"code":"owner_not_manageable","message":"Owners can only be changed through the ownership workflow.","request_id":"01a1692d-dc83-7192-8ee3-56d35554f982"}}
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }

  /api/v1/workspaces/{workspace}/members/{member}/suspend:
    parameters:
      - $ref: '#/components/parameters/Workspace'
