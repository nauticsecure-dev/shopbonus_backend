  /api/v1/consumer/wallet:
    get:
      tags: [Consumer]
      operationId: consumerWallet
      summary: "My wallet balances"
      description: |
        The authoritative balances of the consumer's central wallet, per unit (`eur_credit` in euro cents, `points`), never converted into each other (OPEN-REWARD-UNITS).
                `available` is spendable; `pending` is expected credit that is not spendable yet; `reserved` is held for a checkout in progress. `next_expiry` is the oldest-expiring credit (credit is valid 12 months by default and the oldest-expiring is spent first).
                Credit is non-cash: there is no withdrawal, transfer or payout endpoint.
      x-access: verified
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/consumer/wallet' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Balances."
          content:
            application/json:
              example: {"data":{"balances":{"eur_credit":{"unit":"eur_credit","available":220,"pending":300,"reserved":0,"total_earned":1220,"total_spent":1000,"total_expired":0,"next_expiry":{"amount":220,"at":"2027-10-23T20:24:21+00:00"}},"points":{"unit":"points","available":0,"pending":0,"reserved":0,"total_earned":0,"total_spent":0,"total_expired":0,"next_expiry":null}},"withdrawable":false,"notice":"ShopBonus credit and points are not money: they cannot be withdrawn or transferred."}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a6f-b001-7195-a525-f98115037cb5"}}

  /api/v1/consumer/wallet/transactions:
    get:
      tags: [Consumer]
      operationId: walletTransactions
      summary: "My wallet history"
      description: |
        Newest first. Ledger entry types: `credit`, `debit`, `reserve`, `release`, `expire`, `adjustment`, `reversal`; `amount` is the signed change of the spendable total and `available_after` the balance after it.
                Filters: `earned` (credits), `spent` (debits), `adjustments` (adjustments, reversals, expiries), `holds` (reserve/release), `pending` (pending credits, `spendable: false`, from their own list).
      x-access: verified
      parameters:
        - { name: filter, in: query, required: false, schema: { type: string, enum: [all, earned, spent, pending, adjustments, holds], default: all } }
        - { name: unit, in: query, required: false, schema: { type: string, enum: [eur_credit, points] } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/consumer/wallet/transactions?filter=earned' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "History (captured: one credit, then a reserve + debit for a purchase)."
          content:
            application/json:
              example: {"data":[{"id":"01m5n6z742bdngd1zmms9g23tm","type":"debit","amount":-1000,"unit":"eur_credit","available_after":220,"source":{"type":"voucher_purchase","ref":"demo"},"description":null,"expires_at":null,"created_at":"2026-10-23T20:24:21+00:00"},{"id":"01m5n6z73t0yzvtspczc4tp4er","type":"reserve","amount":0,"unit":"eur_credit","available_after":220,"source":{"type":"voucher_purchase","ref":"demo"},"description":null,"expires_at":null,"created_at":"2026-10-23T20:24:21+00:00"},{"id":"01m5n6z72892ybxx5vkqcpexsa","type":"credit","amount":1220,"unit":"eur_credit","available_after":1220,"source":{"type":"affiliate","ref":"conv-8841"},"description":"Purchase at Fietsen Utrecht","expires_at":"2027-10-23T20:24:21+00:00","created_at":"2026-10-23T20:24:21+00:00"}],"meta":{"current_page":1,"last_page":1,"per_page":25,"total":3}}
        '401':
          description: "Not signed in."
          content:
            application/json:
              example: {"error":{"status":401,"code":"unauthenticated","message":"Authentication is required.","request_id":"01a16a6f-b001-7195-a525-f98115037cb5"}}
        '422':
          description: "Unknown filter or unit."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16a6f-ae82-7212-855f-7c1d4b1686f3","fields":{"filter":["The selected filter is invalid."]}}}

  /api/v1/consumer/wallet/transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Consumer]
      operationId: walletTransaction
      summary: "One wallet transaction"
      description: |
        Details of an own ledger entry, with `remaining` (unspent part, for credits) and `related_to` (e.g. the credit a reversal or expiry refers to). Another consumer's entry is 404.
      x-access: verified
      x-codeSamples:
