                employee: { summary: As employee with an extra orders.view grant, value: {"data": {"id": "01m5mj7namw3ysnwzvha9rkbxf", "name": "Fietsenwinkel Utrecht", "platform": "woocommerce", "status": "draft", "commercially_active": false, "is_current": false, "membership": {"role": "employee", "permissions": ["dashboard.view", "orders.view"], "joined_at": "2026-10-23T14:21:58+00:00"}, "created_at": "2026-10-23T14:21:58+00:00"}} }
