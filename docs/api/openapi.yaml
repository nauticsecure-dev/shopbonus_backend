  /api/v1/workspaces/{workspace}/connections:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      tags: [Integrations]
      operationId: listConnections
      summary: "Connections of this webshop"
      description: |
        Never includes credentials.
      x-access: verified
      x-permission: integrations.view
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET http://localhost:8000/api/v1/workspaces/current/connections \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Connections."
          content:
            application/json:
              example: {"data":[{"id":"01m5mmqdeessjag26x40n5dfk2","platform":"prestashop","method":"private_module","status":"connected","external_shop_ref":null,"limitations":[],"last_event_at":"2026-10-23T15:05:32+00:00","last_verified_order_at":"2026-10-23T15:05:32+00:00","connected_at":"2026-10-23T15:05:32+00:00","disconnected_at":null,"last_error":{"code":"webhook_timestamp_out_of_tolerance","at":"2026-10-23T15:05:32+00:00"},"created_at":"2026-10-23T15:05:31+00:00"},{"id":"01m5mmqdcww6d106jp3f92yez8","platform":"shopify","method":"webhook","status":"limited","external_shop_ref":"fietsen.myshopify.com","limitations":["additional_integration_required"],"last_event_at":"2026-10-23T15:05:32+00:00","last_verified_order_at":"2026-10-23T15:05:32+00:00","connected_at":null,"disconnected_at":null,"last_error":null,"created_at":"2026-10-23T15:05:31+00:00"},{"id":"01m5mmqd944fxvw6ndwyxmd8qs","platform":"woocommerce","method":"webhook","status":"connected","external_shop_ref":null,"limitations":[],"last_event_at":"2026-10-23T15:05:32+00:00","last_verified_order_at":"2026-10-23T15:05:32+00:00","connected_at":"2026-10-23T15:05:32+00:00","disconnected_at":null,"last_error":{"code":"webhook_invalid_signature","at":"2026-10-23T15:05:32+00:00"},"created_at":"2026-10-23T15:05:31+00:00"}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Missing integrations.view."
          content:
            application/json:
              example: {"error":{"status":403,"code":"workspace_permission_denied","message":"You do not have permission to do this in this workspace.","request_id":"01a1694b-b85c-72b8-b65d-c14aabb9109f","details":{"required_permission":"integrations.view"}}}
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
    post:
      tags: [Integrations]
      operationId: createConnection
      summary: "Connect an ecommerce platform"
      description: |
        Starts in `setup_required`. For WooCommerce and Shopbonus-format platforms, Shopbonus generates the signing secret and returns it **once** under `secrets`. For Shopify the merchant supplies `shop_domain` (`*.myshopify.com`) and the `signing_secret` from Shopify admin. The response includes setup steps and the webhook URL. Saving credentials never makes a connection `connected`. One non-disconnected connection per platform per webshop (409 `connection_exists`).
      x-access: verified
      x-permission: integrations.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, description: A platform with available true in /integrations/platforms. }
                shop_domain: { type: string, description: 'Shopify only: <shop>.myshopify.com' }
                signing_secret: { type: string, minLength: 16, description: 'Shopify only: webhook signing secret from Shopify admin.' }
            example: {"platform": "woocommerce"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST http://localhost:8000/api/v1/workspaces/current/connections \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"platform":"woocommerce"}'
      responses:
        '201':
          description: "Created; secret shown once (redacted here)."
          content:
            application/json:
              example: {"data":{"id":"01m5mmqd944fxvw6ndwyxmd8qs","platform":"woocommerce","method":"webhook","status":"setup_required","external_shop_ref":null,"limitations":[],"last_event_at":null,"last_verified_order_at":null,"connected_at":null,"disconnected_at":null,"last_error":null,"created_at":"2026-10-23T15:05:31+00:00","setup":{"format":"woocommerce-webhooks","webhook_url":"https:\/\/api.shopbonus.example\/api\/v1\/webhooks\/woocommerce\/<token>","steps":["In WordPress go to WooCommerce \u2192 Settings \u2192 Advanced \u2192 Webhooks \u2192 Add webhook.","Create two webhooks, topics \"Order created\" and \"Order updated\", status Active, API version WP REST API Integration v3.","Delivery URL: the webhook URL above. Secret: the secret shown once when this connection was created.","Save, then place a real paid test order."]},"secrets":{"webhook_secret":"<secret shown once>"},"secrets_notice":"Shown only once. Store it in your shop settings now; it cannot be retrieved later."}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "platform_not_available or connection_exists."
          content:
            application/json:
              example: {"error":{"status":409,"code":"platform_not_available","message":"This platform cannot be connected yet.","request_id":"01a1694b-b4d7-72f9-976d-87a0751a79b6","details":{"reason":"Request authentication for Wix automations not yet verified."}}}
        '422':
          description: "Invalid platform-specific input."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a1694b-b570-728a-ab48-991f09afe195","fields":{"shop_domain":["The shop domain field format is invalid."],"signing_secret":["The signing secret field must be at least 16 characters."]}}}

