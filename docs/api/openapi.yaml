  /api/v1/admin/agreement-templates:
    get:
      tags: [Admin]
      operationId: adminListAgreementTemplates
      summary: "Agreement templates"
      description: |
        All versions, including drafts and retired ones.
      x-access: admin
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, published, retired] } }
      x-codeSamples:
        - lang: curl
          source: |
            # Browser session (bearer tokens are refused for mutations): cookies from /login, then POST /user/confirm-password
            curl -i -b jar -c jar -X GET http://localhost:8000/api/v1/admin/agreement-templates \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>"
      responses:
        '200':
          description: "Templates."
          content:
            application/json:
              example: {"data":[{"id":"01m5mm2r0zjz3qv3ycdnfbp1n1","key":"merchant_agreement","version":"2026.1","locale":"nl","title":"Merchantovereenkomst 2026 (voorbeeld)","body":"# Merchantovereenkomst (VOORBEELDTEKST, geen juridische inhoud)\n\nPartijen: Shopbonus en {{legal_name}} (KvK {{kvk_number}}), gevestigd te {{address}}, handelend onder {{webshop_name}} ({{website_domain}}).","status":"published","requires_reacceptance":true,"published_at":"2026-10-23T14:54:14+00:00","retired_at":null,"created_at":"2026-10-23T14:54:14+00:00"}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
    post:
      tags: [Admin]
      operationId: adminCreateAgreementTemplate
      summary: "Create a draft agreement version"
      description: |
        Step-up required. Shopbonus seeds no legal text; the owner's legal team supplies it. Unknown placeholders are rejected so no unrendered token can appear in a signed document.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, version, locale, title, body]
              properties:
                key: { type: string, enum: [merchant_agreement] }
                version: { type: string, pattern: '^[A-Za-z0-9._-]+$', maxLength: 32 }
                locale: { type: string, enum: [nl, en] }
                title: { type: string, maxLength: 255 }
                body: { type: string, description: 'Markdown. Placeholders: {{webshop_name}} {{legal_name}} {{trading_name}} {{kvk_number}} {{vat_number}} {{website_domain}} {{address}}; anything else is rejected.' }
                requires_reacceptance: { type: boolean, default: true, description: Whether approved webshops must accept this version before further commercial actions. }
            example: {"key": "merchant_agreement", "version": "2026.1", "locale": "nl", "title": "Merchantovereenkomst", "body": "Partijen: Shopbonus en {{legal_name}} (KvK {{kvk_number}})."}
      x-codeSamples:
        - lang: curl
          source: |
            # Browser session (bearer tokens are refused for mutations): cookies from /login, then POST /user/confirm-password
            curl -i -b jar -c jar -X POST http://localhost:8000/api/v1/admin/agreement-templates \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -H 'Content-Type: application/json' -d '{"key":"merchant_agreement","version":"2026.1","locale":"nl","title":"Merchantovereenkomst","body":"..."}'
      responses:
        '201':
          description: "Draft created (captured with placeholder sample text)."
          content:
            application/json:
              example: {"data":{"id":"01m5mm2r0zjz3qv3ycdnfbp1n1","key":"merchant_agreement","version":"2026.1","locale":"nl","title":"Merchantovereenkomst (voorbeeld)","body":"# Merchantovereenkomst (VOORBEELDTEKST, geen juridische inhoud)\n\nPartijen: Shopbonus en {{legal_name}} (KvK {{kvk_number}}), gevestigd te {{address}}, handelend onder {{webshop_name}} ({{website_domain}}).","status":"draft","requires_reacceptance":null,"published_at":null,"retired_at":null,"created_at":"2026-10-23T14:54:14+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '409':
          description: "template_version_exists (same envelope)."
          content:
            application/json:
              example: {"error":{"status":409,"code":"template_not_draft","message":"Published templates cannot be edited. Create a new version.","request_id":"01a16941-610e-7070-be16-be7ea6648b06"}}
        '422':
          description: "Unknown placeholder or invalid fields."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16941-5fca-72ee-b101-187b427b213f","fields":{"body":["Unknown placeholders: iban. Allowed: webshop_name, legal_name, trading_name, kvk_number, vat_number, website_domain, address."]}}}
        '423':
          description: "No recent password confirmation."
          content:
            application/json:
              example: {"error":{"status":423,"code":"password_confirmation_required","message":"Confirm your password to continue.","request_id":"01a16941-5e14-70c6-9bbf-778b1af35937"}}

  /api/v1/admin/agreement-templates/{template}:
    parameters:
      - { name: template, in: path, required: true, description: Template public ID., schema: { type: string } }
    patch:
      tags: [Admin]
      operationId: adminUpdateAgreementTemplate
      summary: "Edit a draft version"
      description: |
        Step-up required. Drafts only: published text is immutable (409 `template_not_draft`), so create a new version instead.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, enum: [merchant_agreement] }
