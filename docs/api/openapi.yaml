  /api/v1/admin/users/{user}/suspend:
    parameters:
      - { name: user, in: path, required: true, schema: { type: string }, description: User public ID. }
    post:
      tags: [Admin]
      operationId: adminSuspendUser
      summary: "Suspend an account"
      description: |
        Recent password required. Only active accounts (409 `invalid_status_transition`); never yourself (409 `cannot_manage_self`) and never the last active Super Admin (409 `last_super_admin`). Ends access at once: all API tokens deleted, browser sessions deleted (database session driver), support sessions on the user ended; any later request is refused (`account_inactive`). Reversible. Audited with the reason.
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
            example: {"reason": "Verdachte claims, onderzoek loopt"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/admin/users/<user id>/suspend' -b cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"reason":"Verdachte claims, onderzoek loopt"}'
      responses:
        '200':
          description: "Suspended."
          content:
            application/json:
              example: {"data":{"id":"01m5n6z6zsmygsqghb9z5qx0zc","first_name":"Tess","email":"bob.wallet@example.nl","email_verified":true,"status":"suspended","onboarding_intent":"consumer","roles":[],"workspaces":[{"id":"01m5pd8djwvb5yyj12nw5esr56","name":"Woon & Co","role":"employee"}],"two_factor_enabled":false,"registered_at":"2026-10-23T20:24:21+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "Not active, yourself (captured) or last admin."
          content:
            application/json:
              example: {"error":{"status":409,"code":"cannot_manage_self","message":"You cannot suspend your own account.","request_id":"01a16e22-8067-7110-92a1-fd186c262d01"}}
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '423': { $ref: '#/components/responses/PasswordConfirmationRequired' }

