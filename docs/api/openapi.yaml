  /api/v1/banners/events:
    post:
      tags: [Banner embed]
      operationId: publicBannerEvents
      summary: "Report banner events"
      description: |
        Up to 50 events per batch: `eligible`, `viewable_impression` (≥ 50 % visible ≥ 1 s, deduplicated by the embed), `cta_click`, `dismiss` (never a click). Each event has a client UUID: a retried batch counts once (`duplicates`). Paths are stored without query strings; no PII. A consented `cta_click` returns an opaque 30-day click ID for the shop's checkout to pass back with the order (`order.attribution.click_id`). Events older than 2 days or from the future are rejected. Origin allowlisted.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, events]
              properties:
                key: { type: string }
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [id, campaign, version, type, occurred_at, consent]
                    properties:
                      id: { type: string, format: uuid }
                      campaign: { type: string }
                      version: { type: integer }
                      type: { type: string, enum: [eligible, viewable_impression, cta_click, dismiss] }
                      occurred_at: { type: string, format: date-time }
                      device: { type: string, enum: [desktop, tablet, mobile] }
                      path: { type: string }
                      category: { type: string }
                      consent: { type: boolean }
            example: {"key": "pk_4dhphng2rpstr7qw2wybjton", "events": [{"id": "96875328-8eb8-4fcd-94eb-9c1deb4b1e73", "campaign": "01m5py5vc56hm2adbhwxvrfztw", "version": 1, "type": "eligible", "occurred_at": "2026-10-24T12:29:11Z", "device": "desktop", "path": "/collections/jurken?utm_source=x", "category": "fashion", "consent": true}, {"id": "c0dceeb6-0574-432f-b57f-8561767f8d0e", "campaign": "01m5py5vc56hm2adbhwxvrfztw", "version": 1, "type": "viewable_impression", "occurred_at": "2026-10-24T12:29:11Z", "device": "desktop", "path": "/collections/jurken?utm_source=x", "category": "fashion", "consent": true}, {"id": "e8fecc9c-399b-400e-87fd-1a4093e08d33", "campaign": "01m5py5vc56hm2adbhwxvrfztw", "version": 1, "type": "viewable_impression", "occurred_at": "2026-10-24T12:29:11Z", "device": "mobile", "path": "/collections/jurken?utm_source=x", "category": "fashion", "consent": false}, {"id": "b51b04aa-93f8-4597-955a-36e4eead25b6", "campaign": "01m5py5vc56hm2adbhwxvrfztw", "version": 1, "type": "cta_click", "occurred_at": "2026-10-24T12:29:11Z", "device": "desktop", "path": "/collections/jurken?utm_source=x", "category": "fashion", "consent": true}, {"id": "7d053be8-51fb-4ade-a083-fa58ef784f02", "campaign": "01m5py5vc56hm2adbhwxvrfztw", "version": 1, "type": "dismiss", "occurred_at": "2026-10-24T12:29:11Z", "device": "mobile", "path": "/collections/jurken?utm_source=x", "category": "fashion", "consent": false}]}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/banners/events' \
              -H 'Accept: application/json' -H 'Origin: https://www.woonenco.nl' \
              -H 'Content-Type: application/json' -d '{"key":"pk_...","events":[...]}'
      responses:
        '202':
          description: "Accepted (captured: 5 events, one consented click)."
          content:
            application/json:
              example: {"data":{"accepted":5,"duplicates":0,"rejected":0,"click_ids":{"b51b04aa-93f8-4597-955a-36e4eead25b6":"bc_QkPRc69KHHtHC595p7ZkITHV"}}}
        '403':
          description: "Unknown key or origin."
          content:
            application/json:
              example: {"error":{"status":403,"code":"origin_not_allowed","message":"Unknown key or origin not allowed.","request_id":"01a16de2-ef83-71e5-bc6a-de9690c35167"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

