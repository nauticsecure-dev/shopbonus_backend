openapi: 3.1.0
info:
  title: Shopbonus API
  version: 1.0.0-dev
  description: |
    Shopbonus backend REST API. All endpoints are versioned under `/api/v1`.

    **Conventions (apply to every endpoint):**
    - Responses are always JSON (the API forces `Accept: application/json`).
    - Every response carries an `X-Request-Id` header. Clients may send their own
      `X-Request-Id` (8-128 chars of `A-Z a-z 0-9 . _ -`) for cross-system tracing;
      anything else is replaced by a server-generated UUIDv7.
    - Every error uses the `Error` envelope below. Messages for framework errors are
      fixed per status; a 404 is identical whether a record does not exist or belongs
      to another workspace.
    - Money is always integer minor units plus an explicit currency/unit, never floats.
    - Default rate limit: `API_RATE_LIMIT_PER_MINUTE` (default 60) per user when
      authenticated, otherwise per IP. `X-RateLimit-Limit` / `X-RateLimit-Remaining`
      are returned on success; `Retry-After` on 429.

    **Documentation rule:** every endpoint documents an example request and an
    example response captured from a real running server (see `docs/api/README.md`).
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
    description: Liveness and readiness probes for load balancers and monitoring.
  - name: Workspaces
    description: |
      Webshop workspaces and the caller's membership (Trello #2 §3-4, #16). Every workspace-scoped
      route resolves `{workspace}` against the caller's own active memberships: a webshop the caller
      does not belong to returns the same 404 as a non-existent one. `x-permission` names the
      workspace permission a route needs; members without it get 403 `workspace_permission_denied`.
  - name: Onboarding
    description: |
      Business details, onboarding progress and ownership verification (Trello #16). External business
      data never proves ownership; only a DNS/file/domain-email challenge or a Super Admin review does.
  - name: Admin
    description: |
      Super Admin API (`x-access: admin`; platform role granted only by the `shopbonus:grant-super-admin` console
      command). State-changing admin calls also need a password confirmation (POST /user/confirm-password) within
      3 hours from a browser session; bearer tokens are always refused for them (423). Interim step-up until MFA (B16).
  - name: Auth
    description: |
      Registration, email verification, sessions and password recovery (Trello #4).
      First-party SPAs use Sanctum cookie sessions: GET /sanctum/csrf-cookie first, then send
      `X-XSRF-TOKEN` on every state-changing request from an origin in SANCTUM_STATEFUL_DOMAINS.
      /api/v1 also accepts `Authorization: Bearer <Sanctum token>` (token issuance is not public yet).

      `x-access` on each operation: `public` (anyone), `guest` (signed-out only; signed-in
      JSON clients get 409 `already_authenticated`), `authenticated` (active account, verified
      or not), `verified` (active and email-verified; otherwise 403 `email_not_verified`).

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: healthLive
      x-access: public
      summary: Liveness probe
      description: |
        Returns 200 while the PHP process is serving requests. Performs no dependency
        checks. Public, no authentication. Rate limited by the default `api` limiter.
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -s -H 'Accept: application/json' http://localhost:8000/api/v1/health
      responses:
        '200':
          description: Service is alive.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            X-RateLimit-Limit: { $ref: '#/components/headers/X-RateLimit-Limit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/X-RateLimit-Remaining' }
          content:
            application/json:
              schema:
                type: object
                required: [status, service, time]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: shopbonus-api }
                  time: { type: string, format: date-time }
              example:
                status: ok
                service: shopbonus-api
                time: '2026-10-23T12:28:46+00:00'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      x-access: public
      summary: Readiness probe
      description: |
        Checks the database, the cache store and (when cache or queue use Redis) Redis.
        Returns 200 when all pass and 503 when any fail. Public, no authentication.

        Per-component `checks` are included **only** when `X-Health-Token` matches the
        server's `HEALTH_READINESS_TOKEN`, so infrastructure layout is not disclosed
        publicly. Failure causes are logged server-side (exception class only), never
        returned.
      security: []
      parameters:
        - name: X-Health-Token
          in: header
          required: false
          description: Monitoring token; unlocks per-component detail.
          schema: { type: string }
      x-codeSamples:
        - lang: curl
          label: Public (no detail)
          source: |
            curl -s -H 'Accept: application/json' http://localhost:8000/api/v1/health/ready
        - lang: curl
          label: Monitoring (with detail)
          source: |
            curl -s -H 'Accept: application/json' \
              -H 'X-Health-Token: <HEALTH_READINESS_TOKEN>' \
              -H 'X-Request-Id: ops-probe-20261023-01' \
              http://localhost:8000/api/v1/health/ready
      responses:
        '200':
          description: All dependencies reachable.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              examples:
                public:
                  summary: Without token
                  value: { status: ok }
                withDetail:
                  summary: With valid X-Health-Token
                  value:
                    status: ok
                    checks: { database: ok, cache: ok, redis: ok }
        '503':
          description: At least one dependency failed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              examples:
                public:
                  summary: Without token
                  value: { status: fail }
                withDetail:
                  summary: With valid X-Health-Token (database unreachable)
                  value:
                    status: fail
                    checks: { database: fail, cache: ok, redis: ok }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      operationId: csrfCookie
      summary: Start a session and get the CSRF cookie
      description: |
        First call of the SPA before any state-changing request. Sets the `XSRF-TOKEN`
        cookie (readable by JS) and the `shopbonus-session` cookie (HttpOnly, SameSite=Lax;
        Secure in production). Send the decoded `XSRF-TOKEN` value as `X-XSRF-TOKEN` on
        every POST/PUT/DELETE. Must come from an origin listed in `SANCTUM_STATEFUL_DOMAINS`.
      x-access: public
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              http://localhost:8000/sanctum/csrf-cookie
      responses:
        '204':
          description: |
            Cookies set. Captured `Set-Cookie` attributes:
            `XSRF-TOKEN=…; Max-Age=7200; path=/; samesite=lax` and
            `shopbonus-session=…; Max-Age=7200; path=/; httponly; samesite=lax`.

  /register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account (Fortify)
      description: |
        Creates one identity and signs it in (session). Stores Terms and Privacy acceptance at
        the exact current versions (immutable) and an optional marketing-consent record. Queues
        a 6-digit verification code email. `account_type` only selects the post-verification
        destination; it never grants a role or webshop membership. Any other field (role,
        status, admin flags, webshop IDs) is ignored. Returns 503 `legal_documents_unavailable`
        while no Terms/Privacy version is published.

        Rate limits: 5 per 10 minutes per IP, 3 per hour per email.
      x-access: guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_type, first_name, email, password, accept_terms, terms_version, privacy_version]
              properties:
                account_type: { type: string, enum: [consumer, merchant] }
                first_name: { type: string, maxLength: 100 }
                email: { type: string, format: email, description: Stored lower-cased; unique case-insensitively. }
                password: { type: string, minLength: 10, description: At least one letter and one number; breached-password check in production. }
                accept_terms: { type: boolean, const: true }
                terms_version: { type: string, description: Version the user was shown; must equal the current one. }
                privacy_version: { type: string }
                marketing_opt_in: { type: boolean, default: false }
                locale: { type: string, enum: [nl, en], default: nl }
            example:
              account_type: consumer
              first_name: Jan
              email: jan@example.nl
              password: Sterk-wachtwoord-2026
              accept_terms: true
              terms_version: dev-2026-10-23
              privacy_version: dev-2026-10-23
              marketing_opt_in: true
              locale: nl
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/register \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -d '{"account_type":"consumer","first_name":"Jan","email":"jan@example.nl","password":"Sterk-wachtwoord-2026","accept_terms":true,"terms_version":"dev-2026-10-23","privacy_version":"dev-2026-10-23","marketing_opt_in":true,"locale":"nl"}'
      responses:
        '201':
          description: Account created and signed in; verification code queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                data: { id: 01m5mhgrhg7apq2p6wt7084kzn, first_name: Jan, email: jan@example.nl, email_verified: false, status: active, onboarding_intent: consumer, locale: nl, roles: [], workspaces: [], destination: verify_email }
        '409':
          description: Already signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 409, code: already_authenticated, message: You are already signed in., request_id: 01a16918-62f7-7298-a3b9-97ecd027302e }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Invalid input, stale legal version or email taken.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  status: 422
                  code: validation_failed
                  message: The given data was invalid.
                  request_id: 01a16918-6094-7056-8caf-0b8b5c49d766
                  fields:
                    account_type: [The selected account type is invalid.]
                    first_name: [The first name field is required.]
                    password: [The password field must be at least 10 characters., The password field must contain at least one number.]
                    accept_terms: [The accept terms field must be accepted.]
                    terms_version: [The Terms have been updated. Reload the page and review them.]
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: No published Terms/Privacy version; registration disabled (fails closed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 503, code: legal_documents_unavailable, message: Registration is temporarily unavailable., request_id: 01a1691a-31a2-7040-bc08-83a295239267 }

  /login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in (Fortify session)
      description: |
        Rotates the session ID on success and returns the `/me` payload; route on
        `data.destination`, never on a client-supplied URL. Wrong password, unknown email and
        suspended/deleted accounts all get the same 422 message. Rate limits: 5 per minute per
        email+IP and 20 per minute per IP; lockouts are audited.
      x-access: guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                remember: { type: boolean, default: false }
            example: { email: jan@example.nl, password: Sterk-wachtwoord-2026 }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/login \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -d '{"email":"jan@example.nl","password":"Sterk-wachtwoord-2026"}'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                data: { id: 01m5mhgrhg7apq2p6wt7084kzn, first_name: Jan, email: jan@example.nl, email_verified: true, status: active, onboarding_intent: consumer, locale: nl, roles: [], workspaces: [], destination: consumer_dashboard }
        '409':
          description: Already signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 409, code: already_authenticated, message: You are already signed in., request_id: 01a16918-62f7-7298-a3b9-97ecd027302e }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Generic credentials failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 422, code: validation_failed, message: The given data was invalid., request_id: 01a16918-65b4-7353-ba75-c5c007bf9609, fields: { email: [These credentials do not match our records.] } }
        '429':
          description: Locked out.
          headers:
            Retry-After: { $ref: '#/components/headers/Retry-After' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 429, code: too_many_requests, message: Too many requests. Please slow down., request_id: 01a16918-7fde-71d5-a9d1-bae3ad781cda }

  /logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out (Fortify)
      description: Invalidates the session and regenerates the CSRF token. Later protected requests return 401.
      x-access: authenticated
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/logout \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>"
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }

  /forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset link (Fortify)
      description: |
        Always answers 200 with the same message, whether the email exists, is unknown or was
        throttled by the broker (60 s), so it cannot reveal accounts. The link is mailed
        (queued, encrypted payload) and points to `FRONTEND_URL/reset-password?token=…&email=…`.
        Rate limits: 5 per hour per email+IP, 20 per hour per IP.
      x-access: guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example: { email: jan@example.nl }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/forgot-password \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" -d '{"email":"jan@example.nl"}'
      responses:
        '200':
          description: Identical for known and unknown emails.
          content:
            application/json:
              example: { message: 'If an account exists for this email address, a password reset link has been sent.' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the emailed token (Fortify)
      description: |
        Token is single use and expires after 60 minutes. On success every existing session
        is signed out (password-hash check plus deletion of stored sessions), all API tokens
        are revoked and the remember token is rotated. The user is not signed in by this call.
        Rate limit: 10 per hour per IP.
      x-access: guest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
            example: { token: '<token from the email link>', email: jan@example.nl, password: Derde-wachtwoord-2028 }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/reset-password \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -d '{"token":"<token from the email link>","email":"jan@example.nl","password":"Derde-wachtwoord-2028"}'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              example: { message: Your password has been reset. }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Invalid, expired or already used token, or weak password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 422, code: validation_failed, message: The given data was invalid., request_id: 01a16918-7300-70d4-9ff9-711fc215d4b5, fields: { email: [This password reset token is invalid.] } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /user/password:
    put:
      tags: [Auth]
      operationId: updatePassword
      summary: Change password while signed in (Fortify)
      description: |
        Requires the current password. Keeps this session signed in, signs out every other
        session and revokes all API tokens. The 200 body is Fortify's native empty JSON string.
      x-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 10 }
            example: { current_password: Sterk-wachtwoord-2026, password: Nieuw-wachtwoord-2027 }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X PUT http://localhost:8000/user/password \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" \
              -d '{"current_password":"Sterk-wachtwoord-2026","password":"Nieuw-wachtwoord-2027"}'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              example: ''
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Wrong current password or weak new password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 422, code: validation_failed, message: The given data was invalid., request_id: 01a16918-6854-716a-8180-2c96f1b97489, fields: { current_password: [The provided password does not match your current password.] } }

  /user/confirm-password:
    post:
      tags: [Auth]
      operationId: confirmPassword
      summary: Re-confirm the password before a sensitive action (Fortify)
      description: Marks the session's password as freshly confirmed (default 3 hours). Basis for later step-up checks.
      x-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
            example: { password: Nieuw-wachtwoord-2027 }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/user/confirm-password \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" -d '{"password":"Nieuw-wachtwoord-2027"}'
      responses:
        '201':
          description: Confirmed. Body is Fortify's native empty JSON string.
          content:
            application/json:
              example: ''
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 422, code: validation_failed, message: The given data was invalid., request_id: 01a16918-6c9b-7052-a57b-48f8cb5c431f, fields: { password: [The provided password was incorrect.] } }

  /user/confirmed-password-status:
    get:
      tags: [Auth]
      operationId: confirmedPasswordStatus
      summary: Whether the password was recently confirmed (Fortify)
      x-access: authenticated
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -H 'Accept: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              http://localhost:8000/user/confirmed-password-status
      responses:
        '200':
          description: Confirmation state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed: { type: boolean }
              example: { confirmed: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }

  /api/v1/me:
    get:
      tags: [Auth]
      operationId: me
      summary: Current user identity and destination
      description: |
        Minimal identity of the signed-in user (session cookie or bearer token). Allowed for
        unverified users. `id` is the public ULID, never the internal key. `roles` and
        `workspaces` are server-owned and empty until workspace memberships exist (B03).
        `destination` is computed by the server: `verify_email`, `consumer_dashboard` or
        `webshop_setup`.
      x-access: authenticated
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -H 'Accept: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              http://localhost:8000/api/v1/me
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                unverified:
                  summary: Right after registration
                  value:
                    data: { id: 01m5mhgrhg7apq2p6wt7084kzn, first_name: Jan, email: jan@example.nl, email_verified: false, status: active, onboarding_intent: consumer, locale: nl, roles: [], workspaces: [], destination: verify_email }
                verified:
                  summary: After verification
                  value:
                    data: { id: 01m5mhgrhg7apq2p6wt7084kzn, first_name: Jan, email: jan@example.nl, email_verified: true, status: active, onboarding_intent: consumer, locale: nl, roles: [], workspaces: [], destination: consumer_dashboard }
        '401':
          description: Not signed in (e.g. after logout).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 401, code: unauthenticated, message: Authentication is required., request_id: 01a16918-650f-721a-b787-30280f4825eb }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/email/verify-code:
    post:
      tags: [Auth]
      operationId: verifyEmailCode
      summary: Verify the email with the 6-digit code
      description: |
        Consumes the newest open code once. Codes expire after 10 minutes and allow 5 wrong
        attempts, after which the code is burned and a new one must be requested. Error codes:
        `verification_code_invalid`, `verification_code_expired`,
        `verification_code_attempts_exceeded` (422) and `email_already_verified` (409).
        Rate limit: 10 per minute per user+IP.
      x-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
            example: { code: '257424' }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/api/v1/auth/email/verify-code \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>" -d '{"code":"257424"}'
      responses:
        '200':
          description: Verified; returns `/me` with the new destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                data: { id: 01m5mhgrhg7apq2p6wt7084kzn, first_name: Jan, email: jan@example.nl, email_verified: true, status: active, onboarding_intent: consumer, locale: nl, roles: [], workspaces: [], destination: consumer_dashboard }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '409':
          description: Already verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 409, code: email_already_verified, message: This email address is already verified., request_id: 01a16918-6481-71ce-807c-ffc0b282fa7c }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: Wrong, expired or burned code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 422, code: verification_code_invalid, message: This code is not valid., request_id: 01a16918-6384-73d9-b292-51e9fbb6fd50 }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/email/resend-code:
    post:
      tags: [Auth]
      operationId: resendEmailCode
      summary: Send a new verification code
      description: |
        Supersedes all open codes and queues a new email. 60-second cooldown between codes
        (429 `verification_resend_too_soon` with `Retry-After`), and at most 5 per hour
        (429 `too_many_requests`).
      x-access: authenticated
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -c jar -b jar -X POST http://localhost:8000/api/v1/auth/email/resend-code \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'Referer: http://localhost:3000/' \
              -H "X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>"
      responses:
        '202':
          description: |
            New code queued. `resend_available_in_seconds` equals the configured cooldown
            (60 by default; the capture below ran with `VERIFICATION_RESEND_COOLDOWN_SECONDS=0`).
          content:
            application/json:
              example:
                data: { sent: true, expires_at: '2026-10-23T14:21:29+00:00', resend_available_in_seconds: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '409':
          description: Already verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 409, code: email_already_verified, message: This email address is already verified., request_id: 01a16918-6481-71ce-807c-ffc0b282fa7c }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '429':
          description: Cooldown or hourly limit.
          headers:
            Retry-After: { $ref: '#/components/headers/Retry-After' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: { status: 429, code: verification_resend_too_soon, message: Please wait before requesting a new code., request_id: 01a16918-63d9-7335-a770-2ce4d868bd98, details: { retry_after_seconds: 60 } }

  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: Workspaces the user is an active member of (switcher list)
      description: |
        Only active memberships. Each item carries the caller's own role and effective permissions.
        Optional `search` filters by name (case-insensitive substring; wildcards escaped). Sorted by name.
      x-access: verified
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET http://localhost:8000/api/v1/workspaces?search=boek \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: Memberships.
          content:
            application/json:
              example: {"data": [{"id": "01m5mj7ndsfx9z4r1fx0gqhgmq", "name": "Boekhandel Amsterdam", "platform": "shopify", "status": "draft", "commercially_active": false, "is_current": false, "membership": {"role": "owner", "permissions": ["dashboard.view", "orders.view", "orders.manage", "integrations.view", "integrations.manage", "offers.view", "offers.manage", "vouchers.view", "vouchers.manage", "team.view", "team.manage", "settings.view", "settings.manage", "finance.view", "finance.manage", "agreements.accept", "ownership.manage"], "joined_at": "2026-10-23T14:21:58+00:00"}, "created_at": "2026-10-23T14:21:58+00:00"}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a draft webshop; the caller becomes its owner
      description: |
        Any verified user may create a webshop (a consumer can become an owner without a second
        account). Only `name` and `platform` are read: `status`, `role`, `owner`, `created_by` and
        similar fields are ignored. The webshop starts as `draft` and is not commercially active
        until approved (B03d). The first workspace becomes the current one. At most
        `WORKSPACES_MAX_UNAPPROVED_PER_USER` (default 10) unapproved webshops per user; 10 creations per hour.
      x-access: verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                platform: { type: [string, 'null'], enum: [woocommerce, shopify, wix, bigcommerce, ecwid, lightspeed_c, lightspeed_e, prestashop, opencart, shopware6, magento, squarespace, mijnwebwinkel, ccv, other, null] }
            example: { name: Fietsenwinkel Utrecht, platform: woocommerce }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST http://localhost:8000/api/v1/workspaces \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"name":"Fietsenwinkel Utrecht","platform":"woocommerce"}'
      responses:
        '201':
          description: Draft created. (Captured request also sent `status` and `role`; both were ignored.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
              example: {"data": {"id": "01m5mj7namw3ysnwzvha9rkbxf", "name": "Fietsenwinkel Utrecht", "platform": "woocommerce", "status": "draft", "commercially_active": false, "is_current": true, "membership": {"role": "owner", "permissions": ["dashboard.view", "orders.view", "orders.manage", "integrations.view", "integrations.manage", "offers.view", "offers.manage", "vouchers.view", "vouchers.manage", "team.view", "team.manage", "settings.view", "settings.manage", "finance.view", "finance.manage", "agreements.accept", "ownership.manage"], "joined_at": "2026-10-23T14:21:58+00:00"}, "created_at": "2026-10-23T14:21:58+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/EmailNotVerified' }
        '409':
          description: Too many unapproved webshops (captured with the cap set to 3).
          content:
            application/json:
              example: {"error": {"status": 409, "code": "workspace_draft_limit_reached", "message": "You can have at most 3 webshops awaiting approval.", "request_id": "01a16923-d5fa-7221-959b-4f0e672e5b04"}}
        '422':
          description: Invalid name or platform.
          content:
            application/json:
              example: {"error": {"status": 422, "code": "validation_failed", "message": "The given data was invalid.", "request_id": "01a16923-d591-708d-ab15-c8ba0a877d9a", "fields": {"name": ["The name field must be at least 2 characters."], "platform": ["The selected platform is invalid."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/workspaces/{workspace}:
    parameters:
