              example: {"data":[{"id":"01m5py5vc56hm2adbhwxvrfztw","name":"Najaar - \u20ac10 terug","status":"live","template":"ribbon","placement":"top","offer_id":"01m5pefmgdjxy9q4fa1r7pk7cx","draft_revision":2,"live_version":1,"scheduled_at":null,"updated_at":"2026-10-24T12:29:11+00:00","stats_30d":{"viewable_impressions":2,"cta_clicks":1,"ctr":0.5,"attributed_orders":0}}]}
