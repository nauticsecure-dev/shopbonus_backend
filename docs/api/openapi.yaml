  /api/v1/workspaces/{workspace}/offers/{offer}/code-imports:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: offer, in: path, required: true, schema: { type: string } }
    post:
      tags: [Offers]
      operationId: previewCodeImport
      summary: "Preview a code import (paste or CSV)"
      description: |
        Body: `codes` (newline-separated) **or** multipart `file` (CSV/TXT ≤ 5 MB; a `code` column header is used if present, otherwise the first column). XLSX returns 415: save as CSV. Codes are trimmed; format 4–64 of `A-Z a-z 0-9 _ -`; uniqueness is case-insensitive per webshop. The preview reports totals and up to 200 rejections (masked codes, reasons invalid_format, duplicate_in_upload, duplicate_existing) and **creates nothing**. It expires after 60 minutes. A reusable-code offer takes exactly one code. Max 50,000 codes; 10 imports per minute.
      x-access: verified
      x-permission: vouchers.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codes: { type: string, description: One code per line. }
                file: { type: string, format: binary, description: CSV/TXT (multipart). }
            example: {"codes": "WOON-7F3K-0001\nWOON-7F3K-0002"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/offers/<offer id>/code-imports' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"codes":"WOON-7F3K-0001\nWOON-7F3K-0002"}'
      responses:
        '201':
          description: "Preview batch."
          content:
            application/json:
              example: {"data":{"id":"01m5mpjg1tt6q0vjbaw3an5j6j","status":"preview","source":"paste","totals":{"submitted":7,"valid":5,"invalid":1,"duplicate_in_upload":1,"duplicate_existing":0},"rejections":[{"line":4,"code":"********0001","reason":"duplicate_in_upload"},{"line":5,"code":"*****ode!","reason":"invalid_format"}],"expires_at":"2026-10-23T16:37:47+00:00","committed_at":null}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "offer_ended (same envelope)."
          content:
            application/json:
              example: {"error":{"status":409,"code":"batch_not_committable","message":"This import preview was already committed, discarded or has expired.","request_id":"01a16969-40a5-7142-8c99-a2f7af0f69a6"}}
        '415':
          description: "Spreadsheet file."
          content:
            application/json:
              example: {"error":{"status":415,"code":"unsupported_media_type","message":"Spreadsheet files are not supported. Save the sheet as CSV and upload that.","request_id":"01a16969-415b-7100-a383-293a6ea24685"}}
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/workspaces/{workspace}/code-imports/{batch}:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: batch, in: path, required: true, description: Import batch public ID., schema: { type: string } }
    get:
      tags: [Offers]
      operationId: showCodeImport
      summary: "Import batch status and totals"
      description: |
        For polling a queued commit (status preview → committing → committed | failed).
      x-access: verified
      x-permission: vouchers.view
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/code-imports/<batch id>' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Batch."
          content:
            application/json:
              example: {"data":{"id":"01m5mpjg1tt6q0vjbaw3an5j6j","status":"committed","source":"paste","totals":{"valid":5,"invalid":1,"imported":5,"submitted":7,"duplicate_existing":0,"duplicate_at_commit":0,"duplicate_in_upload":1},"rejections":[{"code":"********0001","line":4,"reason":"duplicate_in_upload"},{"code":"*****ode!","line":5,"reason":"invalid_format"}],"expires_at":null,"committed_at":"2026-10-23T15:37:47+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }

  /api/v1/workspaces/{workspace}/code-imports/{batch}/commit:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: batch, in: path, required: true, description: Import batch public ID., schema: { type: string } }
    post:
      tags: [Offers]
      operationId: commitCodeImport
      summary: "Commit a previewed import"
      description: |
        Inserts all still-valid codes in one transaction (all or nothing). Codes added elsewhere since the preview are skipped and counted as `duplicate_at_commit`. More than 2,000 codes are committed by a queued job (202, poll the batch). A batch can be committed once (409 `batch_not_committable`, also when expired). Never charges anything.
      x-access: verified
      x-permission: vouchers.manage
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/code-imports/<batch id>/commit' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Committed."
          content:
            application/json:
              example: {"data":{"id":"01m5mpjg1tt6q0vjbaw3an5j6j","status":"committed","source":"paste","totals":{"valid":5,"invalid":1,"submitted":7,"duplicate_existing":0,"duplicate_in_upload":1,"imported":5,"duplicate_at_commit":0},"rejections":[{"code":"********0001","line":4,"reason":"duplicate_in_upload"},{"code":"*****ode!","line":5,"reason":"invalid_format"}],"expires_at":null,"committed_at":"2026-10-23T15:37:47+00:00"}}
        '202':
          description: "Queued for large batches (captured with 2,100 codes); poll GET /code-imports/{batch}."
          content:
            application/json:
              example: {"data":{"id":"01m5mppysn5brk8ytj9nj4jmwk","status":"committing","source":"paste","totals":{"valid":2100,"invalid":0,"submitted":2100,"duplicate_existing":0,"duplicate_in_upload":0},"rejections":[],"expires_at":null,"committed_at":null}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "Already committed, discarded or expired."
          content:
            application/json:
              example: {"error":{"status":409,"code":"batch_not_committable","message":"This import preview was already committed, discarded or has expired.","request_id":"01a16969-40a5-7142-8c99-a2f7af0f69a6"}}

  /api/v1/workspaces/{workspace}/codes/{code}/reveal:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: code, in: path, required: true, description: Code public ID., schema: { type: string } }
    post:
      tags: [Offers]
      operationId: revealCode
      summary: "Show one full code"
      description: |
        Audited (`codes.revealed`), 30 per minute: protects unused codes against bulk extraction.
      x-access: verified
      x-permission: vouchers.manage
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/codes/<code id>/reveal' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Full code (a fake sample here)."
          content:
            application/json:
              example: {"data":{"id":"01m5mpjg9hymgs43c01a0b4n75","code":"WOON-9Q2L-0002"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Missing vouchers.manage."
          content:
            application/json:
              example: {"error":{"status":403,"code":"workspace_permission_denied","message":"You do not have permission to do this in this workspace.","request_id":"01a16969-4676-73ab-93e1-114c8bdd16e8","details":{"required_permission":"vouchers.manage"}}}
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/workspaces/{workspace}/codes/{code}/invalidate:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: code, in: path, required: true, description: Code public ID., schema: { type: string } }
    post:
      tags: [Offers]
      operationId: invalidateCode
      summary: "Invalidate an unused code"
      description: |
        Only `available` codes (409 `code_not_available` otherwise): reserved and issued codes belong to a consumer flow, and redeemed codes are history. A reason is required. Audited.
      x-access: verified
      x-permission: vouchers.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 255 }
            example: {"reason": "Code wordt niet geaccepteerd in de kassa"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/workspaces/current/codes/<code id>/invalidate' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' \
              -H 'Content-Type: application/json' -d '{"reason":"Not accepted at checkout"}'
      responses:
        '200':
          description: "Invalidated."
          content:
            application/json:
              example: {"data":{"id":"01m5mpjg9hymgs43c01a0b4n75","code":"****0002","status":"invalid","reusable":false,"uses_count":0,"platform_validation":"merchant_verification_required","batch_id":"01m5mpjg7g1qfb396kz5bf87a7","assigned":null,"reserved_at":null,"issued_at":null,"redeemed_at":null,"invalidated_at":"2026-10-23T15:37:49+00:00","invalid_reason":"Code wordt niet geaccepteerd in de kassa","created_at":"2026-10-23T15:37:48+00:00"}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '409':
          description: "Not available."
          content:
            application/json:
              example: {"error":{"status":409,"code":"code_not_available","message":"Only available codes can be invalidated.","request_id":"01a16969-45e1-72e1-8857-681b9b09b091","details":{"status":"invalid"}}}
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /api/v1/workspaces/{workspace}/codes/{code}/history:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: code, in: path, required: true, description: Code public ID., schema: { type: string } }
    get:
      tags: [Offers]
      operationId: codeHistory
      summary: "Code and voucher history"
      description: |
        Append-only events (reserved, code_issued, issued, code_redeemed, redeemed, released, expired, code_invalidated). Never contains code values.
      x-access: verified
      x-permission: vouchers.view
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/codes/<code id>/history' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>'
      responses:
        '200':
          description: "Events."
          content:
            application/json:
              example: {"data":[{"type":"reserved","from_status":null,"to_status":"reserved","summary":{"origin":"merchant_reward","version":1},"recorded_at":"2026-10-23T15:37:48+00:00"},{"type":"code_issued","from_status":"reserved","to_status":"issued","summary":null,"recorded_at":"2026-10-23T15:37:48+00:00"},{"type":"issued","from_status":"reserved","to_status":"issued","summary":null,"recorded_at":"2026-10-23T15:37:48+00:00"}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }

  /api/v1/workspaces/{workspace}/offers/{offer}/codes/export:
    parameters:
      - $ref: '#/components/parameters/Workspace'
      - { name: offer, in: path, required: true, schema: { type: string } }
    get:
      tags: [Offers]
      operationId: exportCodes
      summary: "Export codes as CSV (full values)"
      description: |
        Same filters as the sheet. Contains full code values, so it needs `vouchers.export` (owners and managers by default), is audited and limited to 5 per minute. Formula-injection safe.
      x-access: verified
      x-permission: vouchers.export
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [available, reserved, issued, redeemed, expired, invalid, cancelled] } }
        - { name: batch, in: query, required: false, schema: { type: string } }
        - { name: search, in: query, required: false, description: Exact code (case-insensitive)., schema: { type: string } }
        - { name: assigned, in: query, required: false, description: Has a live (reserved/issued/redeemed) voucher., schema: { type: boolean } }
        - { name: platform_validation, in: query, required: false, schema: { type: string } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/offers/<offer id>/codes/export?status=available' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' -o codes.csv
      responses:
        '200':
          description: "CSV file (captured example in docs/api/README.md)."
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/WorkspacePermissionDenied' }
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  parameters:
    Workspace:
      name: workspace
      in: path
      required: true
      description: Webshop public ID (ULID) or `current` for the caller's selected workspace.
      schema: { type: string }
      example: current

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: shopbonus-session
      description: Sanctum SPA session (plus X-XSRF-TOKEN header on writes).
    bearerToken:
      type: http
      scheme: bearer
      description: Sanctum personal access token.

  headers:
    X-Request-Id:
      description: Correlation ID for this request; quote it in support tickets and logs.
      schema: { type: string }
      example: 01a168bc-3180-72b7-b3eb-05b0fd701ba4
    X-RateLimit-Limit:
      schema: { type: integer }
      example: 60
    X-RateLimit-Remaining:
      schema: { type: integer }
      example: 59
    Retry-After:
      description: Seconds until the client may retry.
      schema: { type: integer }
      example: 43

  schemas:
    Workspace:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string, description: Public ULID. }
            name: { type: string }
            platform: { type: [string, 'null'] }
            status: { type: string, enum: [draft, awaiting_verification, verification_failed, pending_review, approved, rejected, suspended] }
            commercially_active: { type: boolean, description: Only `approved` webshops. }
            is_current: { type: boolean }
            membership:
              type: object
              properties:
                role: { type: string, enum: [owner, manager, employee] }
                permissions: { type: array, items: { type: string }, description: Effective permissions (role defaults + explicit grants). }
                joined_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }

    Me:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, first_name, email, email_verified, status, onboarding_intent, locale, roles, workspaces, destination]
          properties:
            id: { type: string, description: Public ULID (lower-case). }
            first_name: { type: string }
            email: { type: string, format: email }
            email_verified: { type: boolean }
            status: { type: string, enum: [active, suspended, deleted] }
            onboarding_intent: { type: string, enum: [consumer, merchant], description: Signup choice; grants nothing. }
            locale: { type: string, enum: [nl, en] }
            roles: { type: array, items: { type: string }, description: Server-owned; empty until B03. }
            workspaces: { type: array, items: { type: object }, description: Server-owned memberships; empty until B03. }
            destination: { type: string, enum: [verify_email, consumer_dashboard, webshop_setup] }

    Readiness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, fail] }
        checks:
          type: object
          description: Present only with a valid X-Health-Token.
          additionalProperties: { type: string, enum: [ok, fail] }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message, request_id]
          properties:
            status: { type: integer, description: Mirrors the HTTP status. }
            code:
              type: string
              description: |
                Stable machine-readable code. Framework codes: `bad_request`,
                `unauthenticated` (401), `forbidden` (403), `not_found` (404),
                `method_not_allowed` (405), `conflict` (409), `unsupported_media_type`
                (415), `csrf_token_mismatch` (419), `validation_failed` (422),
                `too_many_requests` (429), `server_error` (500), `service_unavailable`
                (503). Domain errors use their own documented codes.
            message: { type: string, description: Human-readable; safe to display. }
            request_id: { type: string }
            fields:
              type: object
              description: 422 only. Field name => list of messages.
              additionalProperties: { type: array, items: { type: string } }
            details:
              type: object
              description: Domain errors only. Extra machine-readable context.
              additionalProperties: true

  responses:
    PlatformRoleRequired:
      description: The caller is not a Super Admin. Audited.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 403, "code": "platform_role_required", "message": "This action requires a platform administrator.", "request_id": "01a16941-5d6e-7359-9671-2839d8dcac47"}}
    PasswordConfirmationRequired:
      description: Step-up needed. Confirm the password (POST /user/confirm-password) in a browser session and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 423, "code": "password_confirmation_required", "message": "Confirm your password to continue.", "request_id": "01a16941-5e14-70c6-9bbf-778b1af35937"}}
    EmailNotVerified:
      description: The account's email is not verified yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 403, "code": "email_not_verified", "message": "Verify your email address to continue.", "request_id": "01a16924-ab43-71d2-83cb-9fa430290df5"}}
    WorkspaceNotFound:
      description: No such webshop, or the caller is not an active member. Both cases look the same and are audited (`workspace.access_denied`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 404, "code": "not_found", "message": "The requested resource was not found.", "request_id": "01a16923-d803-7076-b994-877ecad6f7a3"}}
    WorkspaceSuspended:
      description: The caller is a member, but the webshop is suspended.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 403, "code": "workspace_suspended", "message": "This workspace is suspended.", "request_id": "01a16923-d8bc-710a-8381-3ffeeb3572e2"}}
    WorkspacePermissionDenied:
      description: The caller is a member but lacks the permission named in `details.required_permission`. Audited.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 403, "code": "workspace_permission_denied", "message": "You do not have permission to do this in this workspace.", "request_id": "01a16923-d7e5-7235-a3a5-67e8214491cd", "details": {"required_permission": "settings.manage"}}}
    NoCurrentWorkspace:
      description: '`current` was used but no workspace is selected.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: {"error": {"status": 409, "code": "no_current_workspace", "message": "No workspace is selected.", "request_id": "01a16923-d821-7077-9ca3-9413256a6571"}}
    CsrfMismatch:
      description: Missing/expired CSRF token or cross-site origin. Fetch /sanctum/csrf-cookie and retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 419, code: csrf_token_mismatch, message: The session or CSRF token has expired. Refresh and try again., request_id: 01a16918-6531-73b7-aec9-8f6355a03ffb }
    AccountInactive:
      description: The account is suspended or deleted; the session/token is ended.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 403, code: account_inactive, message: This account is not active., request_id: 01a16918-755d-7150-95c8-7297b7efa823 }
    Unauthenticated:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 401, code: unauthenticated, message: Authentication is required., request_id: 01a168bd-f864-70ce-9573-0f6c6905e5fb }
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 403, code: forbidden, message: You are not allowed to perform this action., request_id: 01a168bd-f891-71fa-b745-e681283411ee }
    NotFound:
      description: Resource does not exist or is outside the caller's scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 404, code: not_found, message: The requested resource was not found., request_id: 01a168bc-4082-739c-a3cb-1995636d37a5 }
    MethodNotAllowed:
      description: HTTP method not supported; see the `Allow` header.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 405, code: method_not_allowed, message: This method is not allowed for the requested resource., request_id: 01a168bc-40c7-7329-ab27-cb1f1a89d354 }
    ValidationFailed:
      description: Input failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              status: 422
              code: validation_failed
              message: The given data was invalid.
              request_id: 01a168bd-f895-73d8-881b-0f4ac0620658
              fields: { email: [The email field must be a valid email address.] }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 429, code: too_many_requests, message: Too many requests. Please slow down., request_id: 01a168bc-72ce-7350-8cbb-acff7fa4bd42 }
    ServerError:
      description: Unexpected failure. Internals are never returned; quote the request_id.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { status: 500, code: server_error, message: An unexpected error occurred., request_id: 01a168bd-f8b0-725d-912b-fc7c412e64d5 }
