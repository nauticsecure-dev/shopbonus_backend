  /api/v1/workspaces/{workspace}/orders/export:
    parameters:
      - $ref: '#/components/parameters/Workspace'
    get:
      tags: [Orders]
      operationId: orderSheetExport
      summary: "Export orders as CSV"
      description: |
        Same filters as the sheet; streamed CSV (amounts as decimals in the order currency). Cells beginning with = + - @ tab or CR are prefixed with an apostrophe against spreadsheet formula injection (this includes phone numbers starting with +). Audited (`orders.exported`), 5 per minute. `orders.export` is held by owners and managers; employees need an explicit grant.
      x-access: verified
      x-permission: orders.export
      parameters:
        - { name: payment_status, in: query, required: false, schema: { type: string, enum: [paid, pending, failed, cancelled, refunded, partially_refunded, unknown] } }
        - { name: ingestion_status, in: query, required: false, schema: { type: string, enum: [complete, incomplete] } }
        - { name: platform, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: search, in: query, required: false, description: Reference prefix, exact external order ID or exact customer email (case-insensitive)., schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [placed_at, -placed_at, amount_minor, -amount_minor], default: -placed_at } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/workspaces/current/orders/export?payment_status=paid' \
              -H 'Accept: application/json' -H 'Authorization: Bearer <token>' -o orders.csv
      responses:
        '200':
          description: "CSV file (see the captured example in docs/api/README.md)."
          content:
            text/csv:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: "Missing orders.export."
          content:
            application/json:
              example: {"error":{"status":403,"code":"workspace_permission_denied","message":"You do not have permission to do this in this workspace.","request_id":"01a16955-5432-739a-8298-b9a73e45fb2c","details":{"required_permission":"orders.export"}}}
        '404': { $ref: '#/components/responses/WorkspaceNotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

