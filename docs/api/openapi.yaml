              example: {"data":{"id":"01m5pzxpagmfpbh19v6pmxbq4p","status":"published","version":"2026.2","requires_reconsent":true,"published_at":"2026-10-24T12:59:40+00:00","texts":{"body":"Wij gebruiken noodzakelijke cookies en, met jouw toestemming, statistiek- en marketingcookies.","title":"Cookies op ShopBonus","customize":"Aanpassen","accept_all":"Alles accepteren","reject_optional":"Optionele weigeren"},"categories":[{"key":"necessary","required":true,"trackers":[{"key":"session","name":"Sessie","provider":"ShopBonus","purpose":"Ingelogd blijven","retention":"Sessie"}]},{"key":"preferences","required":false,"trackers":[]},{"key":"analytics","required":false,"trackers":[{"key":"plausible","name":"Plausible Analytics","provider":"Plausible","purpose":"Anonieme bezoekstatistieken","retention":"24 uur"}]},{"key":"marketing","required":false,"trackers":[{"key":"meta_pixel","name":"Meta Pixel","provider":"Meta","purpose":"Advertenties meten","retention":"90 dagen"}]}]}}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/PlatformRoleRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
