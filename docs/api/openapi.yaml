  /api/v1/public/cookie-consents:
    post:
      tags: [Content]
      operationId: recordCookieConsent
      summary: "Save the visitor's cookie choice"
      description: |
        Appends a decision under the **current** policy version (409 `policy_outdated` otherwise): `accept_all`, `reject_optional`, `customize` (with `choices`) or `withdraw` (needs an earlier `consent_id`). Necessary is always on. Returns the opaque `consent_id` for the browser to keep and `allowed_trackers`: only these may load (consent-aware loader). Stores a hashed IP and the user when signed in; nothing else. Throttled.
      x-access: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version, action]
              properties:
                consent_id: { type: string, format: uuid }
                policy_version: { type: string }
                action: { type: string, enum: [accept_all, reject_optional, customize, withdraw] }
                choices: { type: object, properties: { preferences: { type: boolean }, analytics: { type: boolean }, marketing: { type: boolean } } }
            example: {"consent_id": "8c8f1ceb-adad-46fd-ad27-1c6ff0418c5f", "policy_version": "2026.1", "action": "customize", "choices": {"analytics": true}}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/api/v1/public/cookie-consents' \
              -H 'Accept: application/json' -H 'Accept-Language: nl' \
              -H 'Content-Type: application/json' -d '{"policy_version":"2026.1","action":"reject_optional"}'
      responses:
        '201':
          description: "Recorded (captured: analytics only)."
          content:
            application/json:
              example: {"data":{"consent_id":"8c8f1ceb-adad-46fd-ad27-1c6ff0418c5f","policy_version":"2026.1","action":"customize","choices":{"necessary":true,"preferences":false,"analytics":true,"marketing":false},"recorded_at":"2026-10-24T12:59:40+00:00","allowed_trackers":["session","plausible"]}}
        '404':
          description: "Withdraw without an earlier choice."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"Consent not found.","request_id":"<id>"}}
        '409':
          description: "Policy changed."
          content:
            application/json:
              example: {"error":{"status":409,"code":"policy_outdated","message":"The cookie policy changed. Reload to see the current choices.","request_id":"01a16dfe-d9da-70ae-a369-609cf76c8dfe","details":{"current_version":"2026.2"}}}
        '422':
          description: "Invalid input (captured with Accept-Language: nl)."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"De ingevulde gegevens zijn ongeldig.","request_id":"01a16dfe-daac-7396-9c61-e2190c9eb7bd","fields":{"policy_version":["Beleidsversie is verplicht."],"action":["Actie is verplicht."]}}}
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/public/cookie-consents/{consentId}:
    parameters:
      - { name: consentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Content]
      operationId: cookieConsentStatus
      summary: "The visitor's current cookie choice"
      description: |
        Latest decision, the current policy version and `needs_renewal` (the policy changed with `requires_reconsent`); `allowed_trackers` is empty until renewed.
      x-access: public
      security: []
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X GET 'http://localhost:8000/api/v1/public/cookie-consents/<consent id>' \
              -H 'Accept: application/json' -H 'Accept-Language: nl'
      responses:
        '200':
          description: "Status (captured after v2 required renewal)."
          content:
            application/json:
              example: {"data":{"consent_id":"8c8f1ceb-adad-46fd-ad27-1c6ff0418c5f","policy_version":"2026.1","action":"withdraw","choices":{"analytics":false,"marketing":false,"necessary":true,"preferences":false},"recorded_at":"2026-10-24T12:59:40+00:00","current_policy_version":"2026.2","needs_renewal":true,"allowed_trackers":[]}}
        '404':
          description: "Unknown consent ID."
          content:
            application/json:
              example: {"error":{"status":404,"code":"not_found","message":"Consent not found.","request_id":"<id>"}}

  /user/two-factor-authentication:
    post:
      tags: [Auth]
      operationId: enableTwoFactor
      summary: "Start TOTP two-factor enrolment (Fortify)"
      description: |
        Browser session only, recent password confirmation required (Fortify `confirmPassword`). Generates a TOTP secret and 8 recovery codes; 2FA is **not active** until confirmed with a code from the authenticator app (POST /user/confirmed-two-factor-authentication). Calling it again replaces an unconfirmed secret. Body is Fortify's empty JSON string. Required for Super Admins (`ADMIN_MFA_REQUIRED`), optional for everyone else.
      x-access: authenticated
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/user/two-factor-authentication' -b cookies.txt -c cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>'
      responses:
        '200':
          description: "Secret generated, awaiting confirmation."
          content:
            application/json:
              example: ""
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '423':
          description: "Laravel's password confirmation is older than `auth.password_timeout`: POST /user/confirm-password first."
          content:
            application/json:
              example: {"error":{"status":423,"code":"password_confirmation_required","message":"Confirm your password to continue.","request_id":"01a16e0f-28ca-72e8-b325-1804a1ac38b0"}}
    delete:
      tags: [Auth]
      operationId: disableTwoFactor
      summary: "Turn off two-factor authentication (Fortify)"
      description: |
        Browser session, recent password confirmation required. Removes the secret and recovery codes. A Super Admin who does this loses admin access until 2FA is set up again (403 `mfa_required`).
      x-access: authenticated
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X DELETE 'http://localhost:8000/user/two-factor-authentication' -b cookies.txt -c cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>'
      responses:
        '200':
          description: "Disabled."
          content:
            application/json:
              example: ""
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '423':
          description: "Laravel's password confirmation is older than `auth.password_timeout`: POST /user/confirm-password first."
          content:
            application/json:
              example: {"error":{"status":423,"code":"password_confirmation_required","message":"Confirm your password to continue.","request_id":"01a16e0f-28ca-72e8-b325-1804a1ac38b0"}}

  /user/confirmed-two-factor-authentication:
    post:
      tags: [Auth]
      operationId: confirmTwoFactor
      summary: "Confirm TOTP enrolment with a code (Fortify)"
      description: |
        Browser session, recent password confirmation required. Activates 2FA when the 6-digit code from the authenticator matches; from then on every login asks for the second factor.
      x-access: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 6-digit TOTP code }
            example: {"code": "123456"}
      x-codeSamples:
        - lang: curl
          source: |
            curl -i -X POST 'http://localhost:8000/user/confirmed-two-factor-authentication' -b cookies.txt -c cookies.txt \
              -H 'Accept: application/json' -H 'Origin: http://localhost:3000' -H 'X-XSRF-TOKEN: <decoded XSRF-TOKEN cookie>' \
              -H 'Content-Type: application/json' -d '{"code":"123456"}'
      responses:
        '200':
          description: "Two-factor authentication is active."
          content:
            application/json:
              example: ""
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/AccountInactive' }
        '419': { $ref: '#/components/responses/CsrfMismatch' }
        '422':
          description: "Wrong code."
          content:
            application/json:
              example: {"error":{"status":422,"code":"validation_failed","message":"The given data was invalid.","request_id":"01a16e0f-1a2c-703c-a807-c18dce4e08aa","fields":{"code":["The provided two factor authentication code was invalid."]}}}
        '423':
          description: "Laravel's password confirmation is older than `auth.password_timeout`: POST /user/confirm-password first."
          content:
            application/json:
              example: {"error":{"status":423,"code":"password_confirmation_required","message":"Confirm your password to continue.","request_id":"01a16e0f-28ca-72e8-b325-1804a1ac38b0"}}

